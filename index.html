function residentDelMaxTs(resDel, r){
  const del=resDel&&typeof resDel==='object'&&!Array.isArray(resDel)?resDel:{};
  const id=String(r&&r.id||'').trim();
  const nm=normalizeResidentName(r&&r.name||'');
  const cands=[];
  if(id){
    cands.push(_numU(del[id])); // 旧形式（後方互換）
    cands.push(_numU(del['id:'+id]));
  }
  if(nm) cands.push(_numU(del['name:'+nm]));
  return Math.max(0,...cands);
}
function residentReviveMaxTs(resRevive, r){
  const rev=resRevive&&typeof resRevive==='object'&&!Array.isArray(resRevive)?resRevive:{};
  const id=String(r&&r.id||'').trim();
  const nm=normalizeResidentName(r&&r.name||'');
  const cands=[];
  if(id) cands.push(_numU(rev['id:'+id]));
  if(nm) cands.push(_numU(rev['name:'+nm]));
  return Math.max(0,...cands);
}
function residentDroppedByTombstone(r,resDel,resRevive){
  if(!resDel) return false;
  const delAt=residentDelMaxTs(resDel,r);
  if(!delAt) return false;
  const reviveAt=residentReviveMaxTs(resRevive,r);
  if(reviveAt>=delAt) return false;
  return _numU(r._u)<=delAt;
}
/**
 * 同一利用者の複数バージョン（ローカル・リモート等）を1件にまとめる。
 * - sched / care / id / 氏名などは _u が最大の行をベースにする
 * - serviceType は **更新が新しい行（_u 最大）** を採用（旧「day が1件でも勝ち」は誤った day が残り続けるため廃止）
 */
function mergeResidentGroup(versions){
  if(!versions||!versions.length) return null;
  const v0=versions.map(r=>cloneDeep(r));
  if(v0.length===1){
    const x=v0[0];
    x.serviceType=residentServiceTypeOrDefault(x);
    return x;
  }
  let best=cloneDeep(v0[0]);
  let bestU=_numU(v0[0]._u);
  for(let i=1;i<v0.length;i++){
    const u=_numU(v0[i]._u);
    if(u>bestU){ best=cloneDeep(v0[i]); bestU=u; }
  }
  best._u=Math.max(...v0.map(r=>_numU(r._u)));
  // 請求フィールドは空でない値を優先して引き継ぐ
  const billingFields=['insuredNumber','careManagerOffice','careManagerName',
    'birthDate','careExpiry','costShare','gender','phone','serviceCodeKey','shoguCode','shoguUnit',
    'addonCodes','sameBuilding','transportType','startTime','endTime',
    'dailyServiceCodes','bathSched'];
  billingFields.forEach(f=>{
    const isEmpty = v =>
      !v || v==='' || v==='0' ||
      (Array.isArray(v) && v.length===0) ||
      (typeof v==='object' && !Array.isArray(v) && Object.keys(v).length===0);
    if(isEmpty(best[f])){
      // 空でない値を持つバージョンのうち最も_uが新しいものを採用
      let bestVal=null, bestValU=0;
      v0.forEach(v=>{
        if(!isEmpty(v[f])){
          const u=_numU(v._u);
          if(u>=bestValU){ bestVal=v[f]; bestValU=u; }
        }
      });
      if(bestVal!==null) best[f]=bestVal;
    }
  });
  best.serviceType=residentServiceTypeOrDefault(best);
  return best;
}
function mergeResidentsLoc(a, b, resDel, resRevive){
  resDel=resDel||{};
  resRevive=resRevive||{};
  const groups=new Map();
  const add=(list)=>{
    (list||[]).forEach(r=>{
      if(residentDroppedByTombstone(r,resDel,resRevive)) return;
      const key=String(r.name||r.id||'');
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(r);
    });
  };
  add(a);
  add(b);
  const seen=new Set();
  const out=[];
  groups.forEach(versions=>{
    const r=mergeResidentGroup(versions);
    if(!r) return;
    const nm=normalizeResidentName(r.name);
    if(!nm||seen.has(nm)) return;
    r.name=nm;
    seen.add(nm);
    out.push(r);
  });
  return out.sort(compareResidentsStable);
}

function mergeSuppliesLoc(a, b){
  const delMap=recordItemDelMapActive();
  const m=new Map();
  const addList=(list)=>{
    (list||[]).forEach(s=>{
      if(!s||!s.id) return;
      if(shouldDropMergedSupply(s, delMap)) return;
      const u=_numU(s._u);
      const old=m.get(s.id);
      if(!old||u>old.u) m.set(s.id,{x:cloneDeep(s),u});
    });
  };
  addList(a);
  addList(b);
  return [...m.values()].map(o=>o.x).sort((p,q)=>(p.date||'').localeCompare(q.date||''));
}

function mergePulledDb(local, remote){
  const mergedItemDel=mergeResidentDelMaps(
    (local.settings||{})._recordItemDel,
    (remote.settings||{})._recordItemDel
  );
  _mergeItemDelActive=mergedItemDel;
  try{
    const out={};
    const mergedResDel=mergeResidentDelMaps(
      (local.settings||{})._residentDel,
      (remote.settings||{})._residentDel
    );
    const mergedResRevive=mergeResidentDelMaps(
      (local.settings||{})._residentRevive,
      (remote.settings||{})._residentRevive
    );
    out.residents=mergeResidentsLoc(local.residents, remote.residents, mergedResDel, mergedResRevive);
    out.supplies=mergeSuppliesLoc(local.supplies, remote.supplies);
    out.settings=cloneDeep(local.settings||{});
    const ru=remote._setU||{}, lu=local._setU||{};
    out._setU={};
    [...new Set([...Object.keys(lu),...Object.keys(ru)])].forEach(k=>{
      out._setU[k]=Math.max(_numU(lu[k]),_numU(ru[k]));
    });
    Object.keys(remote.settings||{}).forEach(k=>{
      if(k==='logoB64') return;
      if(SETTINGS_MERGE_UNION_KEYS.has(k)) return;
      if(k==='residentTypes') return;
      if(_numU(ru[k])>_numU(lu[k])){
        const rv=remote.settings[k], lv=(local.settings||{})[k];
        if(!shouldKeepLocalSettingOnRemoteWin(k, lv, rv)) out.settings[k]=cloneDeep(rv);
      }
    });
    out.settings.residentTypes=mergeResidentTypesMaps(
      (local.settings||{}).residentTypes,
      (remote.settings||{}).residentTypes
    );
    SETTINGS_MERGE_UNION_KEYS.forEach(k=>{
      if(!Object.prototype.hasOwnProperty.call(DEFAULT_SETTINGS,k)) return;
      const def=DEFAULT_SETTINGS[k];
      if(!Array.isArray(def)) return;
      const L=(local.settings||{})[k], R=(remote.settings||{})[k];
      let merged=mergeSettingsStringArrayUnion(L,R,def,k);
      if(k==='exUrineMlOptions') merged=sortNumericStringLabelsIfAllNumeric(merged);
      out.settings[k]=merged;
    });
    Object.keys(DEFAULT_SETTINGS).forEach(k=>{
      if(k==='logoB64') return;
      const cur=out.settings[k], def=DEFAULT_SETTINGS[k], cloud=(remote.settings||{})[k];
      if(cur===undefined||cur===null||cur===''){
        const cloudOk=cloud!==undefined&&cloud!==null&&cloud!=='';
        out.settings[k]=cloudOk?cloneDeep(cloud):cloneDeep(def);
      } else if(Array.isArray(def)&&def.length>0&&Array.isArray(cur)&&cur.length===0){
        if(Array.isArray(cloud)&&cloud.length>0) out.settings[k]=cloneDeep(cloud);
        else if(!['staffList','supplyProducts'].includes(k)&&Array.isArray(def)&&def.length>0)
          out.settings[k]=cloneDeep(def);
      }
    });
    const lrec=normalizeRecordsMap(local.records||{});
    const rrec=normalizeRecordsMap(remote.records||{});
    const dates=new Set([...Object.keys(lrec), ...Object.keys(rrec)]);
    out.records={};
    dates.forEach(dk=>{
      out.records[dk]={};
      const names=new Set([...Object.keys((lrec||{})[dk]||{}), ...Object.keys((rrec||{})[dk]||{})]);
      names.forEach(nm=>{
        out.records[dk][nm]=mergeRecordDay(
          (lrec[dk]||{})[nm],
          (rrec[dk]||{})[nm],
          dk,nm
        );
      });
    });
    normalizeVitalTempsInRecords(out.records);
    coalesceAllRecordArrays(out.records);
    out.settings._residentDel=mergeResidentDelMaps(mergedResDel, out.settings._residentDel||{});
    out.settings._residentRevive=mergeResidentDelMaps(mergedResRevive, out.settings._residentRevive||{});
    out.settings._recordItemDel=mergeResidentDelMaps(mergedItemDel, out.settings._recordItemDel||{});
    const logo=(local.settings||{}).logoB64;
    if(logo) out.settings.logoB64=logo;
    (out.residents||[]).forEach(r=>{
      r.serviceType=getResidentClassification(r.name, out.settings, out.residents)==='inpatient'?'resident':'day';
    });
    return out;
  }finally{
    _mergeItemDelActive=null;
  }
}

function gasPost(extra){
  const url=gasUrl(), tok=gasToken();
  if(!url||!tok) return Promise.reject(new Error('GAS未設定（データ管理でURL・トークンを入力）'));
  // charset 付きだと環境によっては CORS のプリフライトが発生し、GAS が OPTIONS に応答できず失敗することがある
  return fetch(url,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({}, extra, {token:tok}))
  }).then(r=>{
    if(!r.ok) return r.text().then(t=>{
      const err='HTTP '+r.status+': '+t.slice(0,200);
      if(/quota/i.test(t)) throw Object.assign(new Error(err),{quota:true});
      throw new Error(err);
    });
    return r.json();
  }).then(j=>{
    if(!j.ok){
      const err=String(j.error||j.message||'GAS応答エラー');
      if(/quota/i.test(err)) throw Object.assign(new Error(err),{quota:true});
      throw new Error(err);
    }
    return j;
  });
}

function isStorageQuotaError(e){
  const msg=String(e&&e.message||e||'').toLowerCase();
  return /quota|exceeded|storage full|disk full|nospace/i.test(msg);

const KAIGO_RESIDENT_U_COL = 34;
/** 直近プッシュ時刻より新しい利用者 _u を付与（証書・ケアマネ取込が差分同期で漏れないように） */
function lastPushTsForSync_(){
  if(!FAC) return 0;
  return _numU(localStorage.getItem(FAC.storageKey+KAIGO_PUSH_TS_SUFFIX));
}
function touchResidentUForSync(r, staggerIdx){
  if(!r) return;
  const base=Math.max(Date.now(), lastPushTsForSync_()+1);
  const bump=(typeof staggerIdx==='number'&&staggerIdx>=0)?staggerIdx:0;
  r._u=Math.max(_numU(r._u), base+bump);
}
/** ケアマネCSVの事業所一覧を settings.careManagerList にマージ（既存の担当者名は維持） */
function mergeCareManagerOfficesIntoList(existing, assignments){
  const list=Array.isArray(existing)?existing.slice():[];
  const byCode=new Map();
  list.forEach(cm=>{
    const c=String(cm&&cm.officeCode||'').trim();
    if(c) byCode.set(c, cm);
  });
  (assignments||[]).forEach(a=>{
    const code=String(a.officeCode||'').trim();
    if(!code||byCode.has(code)) return;
    const ent={officeCode:code, officeName:String(a.officeName||''), name:''};
    byCode.set(code, ent);
    list.push(ent);
  });
  return list;
}
const KAIGO_PUSH_TS_SUFFIX = ':last_push_ts_v1';
const KAIGO_PUSH_RIDS_SUFFIX = ':rid_snapshot_v1';
const KAIGO_DELTA_MAX_PATCH_ROWS = 3500;
const KAIGO_DELTA_MAX_REMOVE_RIDS = 3500;

function loadRidSnapshotForPush_(storageKey){
  try{
    const raw=localStorage.getItem(storageKey+KAIGO_PUSH_RIDS_SUFFIX);
    if(raw==null) return null;
    const j=JSON.parse(raw);
    return Array.isArray(j)?j:null;
  }catch(_){ return null; }
}

function sheetSupplyRowUpdatedAt_(row){
  if(!row||!row.length) return 0;
  return _numU(row.length>=7 ? row[6] : row[5]);
}

function extractRecRidsFromSheetRows(fullRows){
  const ids=[];
  let i=0;
  while(i<fullRows.length && String(fullRows[i][0])!==SEC_REC) i++;
  if(i>=fullRows.length) return ids;
  i+=2;
  while(i<fullRows.length){
    const r=fullRows[i];
    if(!r||!r.length){ i++; continue; }
    const c0=String(r[0]||'');
    if(c0===SEC_SET||c0===SEC_SUP) break;
    ids.push(String(r[0]||''));
    i++;
  }
  return ids;
}

/**
 * 直近のプッシュ時刻より新しいシート行だけを抽出（GAS で既存シートへマージする差分）。
 * fullRows は dbToSheet(db) と同じ並びであること。
 */
function extractPushDeltaSlices(fullRows, sinceTs){
  const recRows=[], resRows=[], setRows=[], supRows=[];
  let i;
  i=0;
  while(i<fullRows.length && String(fullRows[i][0])!==SEC_RES) i++;
  if(i<fullRows.length){
    i++;
    if(i<fullRows.length) i++;
    while(i<fullRows.length){
      const r=fullRows[i];
      if(!r||!r.length){ i++; continue; }
      if(String(r[0])===SEC_REC) break;
      const nm=String(r[1]||'').trim();
      const id=String(r[0]||'').trim();
      if(!nm&&!id){ i++; continue; }
      if(_numU(r[KAIGO_RESIDENT_U_COL])>sinceTs) resRows.push(r.slice());
      i++;
    }
  }
  i=0;
  while(i<fullRows.length && String(fullRows[i][0])!==SEC_REC) i++;
  if(i>=fullRows.length) return {recRows,resRows,setRows,supRows};
  i+=2;
  while(i<fullRows.length){
    const r=fullRows[i];
    if(!r||!r.length){ i++; continue; }
    const c0=String(r[0]||'');
    if(c0===SEC_SET||c0===SEC_SUP) break;
    const kind=String(r[REC.k]||'');
    let includeRec=_numU(r[REC.uu])>sinceTs;
    if(kind==='calc'){
      try{
        const ej=JSON.parse(r[REC.exj]||'{}');
        if(!!ej.calculated) includeRec=true;
      }catch(_){}
    }
    if(includeRec) recRows.push(r.slice());
    i++;
  }
  while(i<fullRows.length && String(fullRows[i][0])!==SEC_SET) i++;
  if(i<fullRows.length && String(fullRows[i][0])===SEC_SET){
    i+=2;
    while(i<fullRows.length){
      const r=fullRows[i];
      if(!r||!r.length){ i++; continue; }
      if(String(r[0])===SEC_SUP) break;
      const k=String(r[0]||'').trim();
      if(!k){ i++; continue; }
      if(_numU(r[2])>sinceTs) setRows.push(r.slice());
      i++;
    }
  }
  while(i<fullRows.length && String(fullRows[i][0])!==SEC_SUP) i++;
  if(i<fullRows.length && String(fullRows[i][0])===SEC_SUP){
    i+=2;
    while(i<fullRows.length){
      const r=fullRows[i];
      if(!r||!r.length){ i++; continue; }
      const id=String(r[0]||'').trim();
      if(!id){ i++; continue; }
      if(sheetSupplyRowUpdatedAt_(r)>sinceTs) supRows.push(r.slice());
      i++;
    }
  }
  return {recRows,resRows,setRows,supRows};
}

function finalizePushSuccessState_(storageKey, wantedRids){
  localStorage.setItem(storageKey+KAIGO_PUSH_TS_SUFFIX,String(Date.now()));
  localStorage.setItem(storageKey+KAIGO_PUSH_RIDS_SUFFIX,JSON.stringify(wantedRids));
}

function runGasPushCycle(){
  if(!gasConfigured()){ setSyncStatusIfGasMissing(); return Promise.resolve(); }
  if(!syncDirty) return Promise.resolve();
  const sk=FAC.storageKey;
  const cycleVersionStart=syncDirtyVersion;
  setSyncStatus('同期中...','#185FA5');
  return gasPost(gasPullBody_())
    .then(j=>{
      const raw=j.rows||[];
      if(sheetLooksLikeCorruptMarker(raw)){
        const got=sheetTopCell(raw)||'(空)';
        if(!localDbHasSyncableData()){
          setSyncStatus('同期:A1不正(中断)','orange');
          console.warn('runGasPushCycle: シート「'+FAC.sheetName+'」A1は「'+SYNC_MARKER+'」が必要。実際:', got);
          return Promise.reject(Object.assign(new Error('bad_sheet_marker'),{silent:true,a1:got}));
        }
        try{
          localStorage.setItem(sk+'_repair_backup_v1', JSON.stringify({ts:Date.now(),db:cloneDeep(db)}));
        }catch(_){}
        const remotePartial=sheetToDbLenient(raw);
        const remoteDays=countRecordDaysInDbObj(remotePartial);
        const localDays=countRecordDaysInDbObj(db);
        if(remoteDays>0){
          db=mergePulledDb(db, remotePartial);
          console.warn('A1修復: シートから記録'+remoteDays+'日分をマージ（ローカル'+localDays+'日）');
        }
        setSyncStatus('シートA1修復中…','#185FA5');
        const fullRows=dbToSheet(db);
        return gasPost({action:'push',sheetName:FAC.sheetName,rows:fullRows})
          .then(()=>({_sheetRepaired:true,_mergedRemoteDays:remoteDays}));
      }
      const remote=sheetToDb(raw);
      db=mergePulledDb(db, remote);
      const fullRows=dbToSheet(db);
      const wantedRids=extractRecRidsFromSheetRows(fullRows);
      const prevSnap=loadRidSnapshotForPush_(sk);
      const lastTs=_numU(localStorage.getItem(sk+KAIGO_PUSH_TS_SUFFIX));
      const wantSet=new Set(wantedRids);
      const removed=Array.isArray(prevSnap)?prevSnap.filter(id=>!wantSet.has(String(id))):[];
      const useDelta=Array.isArray(prevSnap)&&lastTs>0;

      let pushBody=null;
      let patchTotal=0;
      if(useDelta){
        const d=extractPushDeltaSlices(fullRows,lastTs);
        patchTotal=d.recRows.length+d.resRows.length+d.setRows.length+d.supRows.length;
        if(patchTotal>KAIGO_DELTA_MAX_PATCH_ROWS||removed.length>KAIGO_DELTA_MAX_REMOVE_RIDS){
          pushBody=null;
        }else if(patchTotal===0&&removed.length===0){
          pushBody=null;
        }else{
          pushBody={
            action:'push',
            sheetName:FAC.sheetName,
            merge:true,
            recordRows:d.recRows,
            residentRows:d.resRows,
            settingRows:d.setRows,
            supplyRows:d.supRows,
            removeRecRids:removed
          };
        }
      }
      if(!pushBody){
        if(useDelta && patchTotal===0 && removed.length===0){
          return {_skippedPush:true};
        }
        if(!syncDirty){
          return {_skippedPush:true};
        }
        pushBody={action:'push',sheetName:FAC.sheetName,rows:fullRows};
      }
      return gasPost(pushBody).then(()=>({_sheetRepaired:false}));
    })
    .then(meta=>{
      const sk=FAC.storageKey;
      const wantedRids=extractRecRidsFromSheetRows(dbToSheet(db));
      persistLocalQuiet();
      mirrorResidentTypesToLocalStorage();
      // 同期中に新規保存が入った場合は未送信フラグを残し、次便を必ず実行する
      const hasNewerChanges=(syncDirtyVersion!==cycleVersionStart);
      const skippedPush=!!(meta&&meta._skippedPush);
      if(!hasNewerChanges){
        finalizePushSuccessState_(sk,wantedRids);
      }
      syncDirty=hasNewerChanges;
      if(syncDirty) localStorage.setItem(sk+'_dirty','1');
      else localStorage.removeItem(sk+'_dirty');
      renderMain();
      const n=new Date();
      const repaired=!!(meta&&meta._sheetRepaired);
      const statusLabel=skippedPush
        ?`取得のみ ${n.getHours()}:${pad(n.getMinutes())}`
        :(repaired?`A1修復して反映済 ${n.getHours()}:${pad(n.getMinutes())}`:`反映済 ${n.getHours()}:${pad(n.getMinutes())}`);
      setSyncStatus(statusLabel,'green');
      if(repaired){
        const md=meta&&meta._mergedRemoteDays!=null?Number(meta._mergedRemoteDays):0;
        const extra=md>0?`（シートの記録${md}日分を取り込み済）`:'';
        showBriefToast('「'+FAC.sheetName+'」シートのA1を修復して同期しました'+extra, 4200, false);
      }
      if(hasNewerChanges){
        // 直前push中に追加入力された分を確実に送る（次便）
        scheduleGasSync();
      }
    })
    .catch(e=>{
      if(e&&e.silent){
        if(String(e.message||'').indexOf('bad_sheet_marker')>=0){
          const a1=e.a1!=null?String(e.a1):'';
          showBriefToast('シート「'+(FAC&&FAC.sheetName||'')+'」のA1が「'+SYNC_MARKER+'」ではありません（現在:「'+a1+'」）。スプレッドシートのA1を確認するか、この端末にデータがある状態で🔄同期してください。', 6000, true);
        }
        return Promise.reject(e);
      }
      console.error(e);
      const msg=String(e.message||'');
      if(e&&e.quota||/quota/i.test(msg)){
        setSyncStatus('同期:容量/回数上限','orange');
        showBriefToast('Google側の容量または実行回数上限です。しばらく待ってから🔄同期してください。iPadはデータ管理で古い記録削除も検討してください。', 8000, true);
      }else{
        setSyncStatus('同期失敗: '+msg.slice(0,80),'orange');
      }
      return Promise.reject(e);
    });
}

let gasDebounceTimer=null;
function scheduleGasSync(){
  if(!FAC||window._kaigoGasSaving) return;
  if(gasDebounceTimer) clearTimeout(gasDebounceTimer);
  gasDebounceTimer=setTimeout(()=>{
    gasDebounceTimer=null;
    if(!gasConfigured()) return;
    runGasPushCycle();
  }, 2500);
}

function syncNow(force){
  if(!FAC){ setSyncStatus('施設未選択','orange'); return Promise.resolve(); }
  if(!gasConfigured()){ setSyncStatusIfGasMissing(); return Promise.resolve(); }
  syncDirty=true;
  return runGasPushCycle();
}

/** 定時自動同期（9:00・15:00）。アプリが開いているときのみ */
let _autoSyncLastHour=-1;
let _scheduledSyncInterval=null;

function startScheduledSync(){
  if(_scheduledSyncInterval){
    clearInterval(_scheduledSyncInterval);
    _scheduledSyncInterval=null;
  }
  _scheduledSyncInterval=setInterval(()=>{
    if(!FAC||!gasConfigured()) return;
    const now=new Date();
    const h=now.getHours();
    const m=now.getMinutes();
    const isScheduledTime=(h===9||h===15)&&m===0;
    if(isScheduledTime&&_autoSyncLastHour!==h){
      _autoSyncLastHour=h;
      doScheduledSync();
    }
  }, 60*1000);
}

  showSyncBanner('ただいま同期中です。記録は少々お待ちください。');
  showBriefToast('ただいま同期中です。記録は少々お待ちください。', 10000);

    .then(()=>{
      hideSyncBanner();

    .catch(e=>{
      hideSyncBanner();
      if(e&&e.silent) return;
      showBriefToast('自動同期に失敗しました。手動で🔄同期してください。', 5000, true);
    });
}

function _ymdNoDash(d){

function _calcEffectiveTime(rec, resident){
  const st=_cleanTimeHHMM((rec&&rec.calcStartTime)||'') || _cleanTimeHHMM((resident&&resident.startTime)||'');
  const et=_cleanTimeHHMM((rec&&rec.calcEndTime)||'') || _cleanTimeHHMM((resident&&resident.endTime)||'');
  return {st,et};
}
function _calcEffectiveServiceCode(rec, resident){
  const c=String((rec&&rec.calcServiceCodeKey)||'').trim() || String((resident&&resident.serviceCodeKey)||'').trim();
  return c;
}

function ensureTimeDatalist(){
  if(document.getElementById('timeOptions30min')) return;
  const dl=document.createElement('datalist');
  dl.id='timeOptions30min';
  for(let h=6;h<=20;h++){

      dl.appendChild(opt);

/** 算定確定ダイアログ用：datalist は iPad 等で効かないため select で時刻一覧を出す */
function buildSanteiHHMMSelectOptions(selected){
  const cleaned=_cleanTimeHHMM(String(selected||'').trim())||'';
  const standardSlots=new Set();
  let html='';
  for(let h=6;h<=20;h++){
    ['00','30'].forEach(m=>{
      const v=String(h).padStart(2,'0')+m;
      standardSlots.add(v);
      html+=`<option value="${v}"${cleaned===v?' selected':''}>${v}</option>`;
    });
  }
  if(cleaned && !standardSlots.has(cleaned)){
    html=`<option value="${escapeAttr(cleaned)}" selected>${escapeHtml(cleaned)}</option>`+html;
  }
  return html;
}
/** 算定確定ダイアログ用：当日の予定実績（提供票の日別開始終了）があればそれを、なければ基本時間 */
function getResidentScheduleDayTimes(resident, dateKey){
  _ensureResidentBillingFields(resident);
  const defSt=_cleanTimeHHMM(resident.startTime)||facilityDefaultStartTime();
  const defEt=_cleanTimeHHMM(resident.endTime)||facilityDefaultEndTime();
  const parts=String(dateKey||'').split('-');
  if(parts.length<3) return {st:defSt, et:defEt};
  const yyyymm=`${parts[0]}-${parts[1]}`;
  const dd=parts[2];
  const daily=(resident.dailyServiceCodes||{})[yyyymm]||{};
  const pick=e=>{
    if(!e||typeof e!=='object') return null;
    const st=_cleanTimeHHMM(e.startTime);
    const et=_cleanTimeHHMM(e.endTime);
    if(st||et) return {st:st||defSt, et:et||defEt};
    return null;
  };
  let t=pick(daily[dd]);
  if(!t) t=pick(daily[dd+'_2']);
  if(t) return t;
  return {st:defSt, et:defEt};
}

function execSanteiConfirm(){
  const dayIdx=curDate.getDate()-1;
  const chks=[...document.querySelectorAll('.santei-chk')];
  chks.forEach(ch=>{
    const name=ch.getAttribute('data-res-name');
    if(!name) return;
    const rec=getRec(name, dk());
    if(!ch.checked){
      if(rec.calculated||_numU(rec._calcU)>0){
        clearCalcForSync(rec);
      }
      return;
    }
    const r=(db.residents||[]).find(x=>normalizeResidentName(x.name)===normalizeResidentName(name)) || dbResidentByNameLoose(name);
    const stInp=document.querySelector(`.santei-time[data-kind="start"][data-res-name="${CSS.escape(name)}"]`)?.value||'';
    const etInp=document.querySelector(`.santei-time[data-kind="end"][data-res-name="${CSS.escape(name)}"]`)?.value||'';
    const st=_cleanTimeHHMM(stInp);
    const et=_cleanTimeHHMM(etInp);
    const m=resolveServiceCodeByTime(st,et,name);
    rec._calcU=Date.now();
    rec.calculated=true;
    rec.calcStartTime=st;
    rec.calcEndTime=et;
    rec.calcServiceCodeKey=m?String(m.code||''):'';
    // 送迎区分を保存（ドロップダウンの値を優先、なければ利用者基本情報）
    const transportEl=document.querySelector(`.santei-transport[data-res-name="${CSS.escape(name)}"]`);
    let transportVal=transportEl?transportEl.value:defaultTransportForSanteiDialog(r,rec);
    if(santeiTransportLockedBoth(r)) transportVal='both';
    rec.calcTransportType=transportVal;
    rec._calcU=Date.now();
    // 入浴以外のofficeAddonCodesのみ初期値として設定
    const baseAddons=((db.settings&&db.settings.officeAddonCodes)||[])
      .filter(c=>String(c)!=='785301'&&String(c)!=='785303');
    rec.calcAddons=[...baseAddons];
    applyDeductAddonsToRecord(rec,r);
    // 送迎区分に応じて785612を制御
    rec.calcAddons=rec.calcAddons.filter(c=>String(c)!=='785612');
    if(transportVal==='none'){
      rec.calcAddons.push('785612'); // 送迎なし：両道減算（回数2）
    } else if(transportVal==='one'){
      rec.calcAddons.push('785612'); // 片道：減算（回数1）
    }
    // 入浴チェックがONの場合のみ785301を付加
    const bathEl=document.querySelector(`.santei-bath[data-res-name="${CSS.escape(name)}"]`);
    rec.bathCalculated=!!(bathEl&&bathEl.checked);
    if(rec.bathCalculated){
      if(!rec.calcAddons.includes('785301')) rec.calcAddons.push('785301');
    }
  });
  const calToday=dk(new Date());
  if(dk()===calToday){
    db.settings=db.settings||{};
    db.settings.lastSanteiConfirmYmd=calToday;
  }
  saveDB();
  closeMainOv();
  renderMain();
  showBriefToast('算定を確定しました',2000,false);
}

  const total=files.length;
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result, {type:'array'});
        const ws=wb.Sheets['スケジュール'];
        if(!ws){ results.push({file:file.name, status:'error', msg:'シート「スケジュール」がありません'}); done++; checkDone(); return; }
        const data=XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        let residentName='';
        for(let ri=5; ri<=10; ri++){
          const row=data[ri]||[];
          for(let ci=0; ci<row.length; ci++){
            const val=String(row[ci]||'').trim();
            if(val&&!val.includes('フリガナ')&&!val.includes('被保険者')&&!val.includes('番号')&&/[\u4e00-\u9fa5\u30a0-\u30ff]/.test(val)&&val.length>=2&&val.length<=10){
              const nm=normalizeResidentName(val);
              const hit=(db.residents||[]).find(r=>normalizeResidentName(r.name)===nm);
              if(hit){ residentName=hit.name; break; }
            }
          }
          if(residentName) break;
        }
        if(!residentName){
          const fname=file.name.replace(/\.[^.]+$/,'');
          const parts=fname.split('_');
          if(parts[0]){
            const nm=normalizeResidentName(parts[0]);
            const hit=(db.residents||[]).find(r=>normalizeResidentName(r.name)===nm);
            if(hit) residentName=hit.name;
          }
        }
        if(!residentName){ results.push({file:file.name, status:'error', msg:'利用者名が特定できませんでした'}); done++; checkDone(); return; }
        const resident=(db.residents||[]).find(r=>normalizeResidentName(r.name)===normalizeResidentName(residentName));
        if(!resident){ results.push({file:file.name, status:'skip', msg:`${residentName}：未登録`}); done++; checkDone(); return; }
        _ensureResidentBillingFields(resident);
        let year=schedYear, month=schedMonth+1;
        for(let ri=0; ri<=3; ri++){
          const row=data[ri]||[];
          const rowStr=row.join('');
          const m=rowStr.match(/(\d{1,2})\s*年\s*(\d{1,2})\s*月/);
          if(m){
            const nengoMatch=rowStr.match(/令和\s*(\d+)/);
            if(nengoMatch) year=2018+parseInt(nengoMatch[1],10);
            month=parseInt(m[2],10);
            break;
          }
        }
        const yyyymm=`${year}-${pad(month)}`;
        let dateHeaderRow=-1, dateColStart=-1;
        for(let ri=13; ri<=18; ri++){
          const row=data[ri]||[];
          for(let ci=0; ci<row.length; ci++){
            const v=String(row[ci]||'').trim();
            if(v==='1'){
              // 前後に '2' や '3' があれば日付行と判定（列間隔を問わない）
              let has2=false, has3=false;
              for(let cj=ci+1; cj<Math.min(ci+8, row.length); cj++){
                if(String(row[cj]||'').trim()==='2') has2=true;
                if(String(row[cj]||'').trim()==='3') has3=true;
              }
              if(has2&&has3){
                dateHeaderRow=ri;
                dateColStart=ci;
                break;
              }
            }
          }
          if(dateHeaderRow>=0) break;
        }
        if(dateHeaderRow<0){ results.push({file:file.name, status:'error', msg:'日付行が見つかりません'}); done++; checkDone(); return; }
        const dateRow=data[dateHeaderRow]||[];
        const dateColMap={};
        for(let ci=dateColStart; ci<dateRow.length; ci++){
          const v=parseInt(String(dateRow[ci]||'').trim(),10);
          if(v>=1&&v<=31) dateColMap[v]=ci;
        }
        const OUR_OFFICE='デイサービスおひさま';
        const dailyCodes={};
        const bathDays=new Array(31).fill(0);
        const basicMaster=(_svcMaster().basic||[]);
        let currentStartTime='', currentEndTime='', currentServiceName='', currentOffice='';
        for(let ri=dateHeaderRow+2; ri<data.length; ri++){
          const row=data[ri]||[];
          const cell0=String(row[0]||'').trim();
          const cell5=String(row[5]||'').trim();
          const cell12=String(row[12]||'').trim();
          const cell35=String(row[35]||'').trim();
          if(cell0.match(/^\d{1,2}:\d{2}/)){
            currentStartTime=_cleanTimeHHMM(cell0)||currentStartTime;
            currentEndTime='';
          }
          if(cell0.match(/^[～〜~]\s*\d{1,2}:\d{2}/)){
            const etStr=cell0.replace(/^[～〜~]\s*/, '').trim();
            currentEndTime=_cleanTimeHHMM(etStr)||facilityDefaultEndTime();
          }
          if(cell5) currentServiceName=cell5;
          if(cell12) currentOffice=cell12;
          if(cell35!=='予定') continue;
          if(!currentOffice.includes('おひさま')&&!currentOffice.includes(OUR_OFFICE)) continue;
          const svcName=currentServiceName;
          const isBasic=basicMaster.some(m=>m.name===svcName)||
            (svcName.includes('地域通所介護')&&!svcName.includes('加算')&&!svcName.includes('減算')&&!svcName.includes('処遇'));
          const isBath=svcName.includes('入浴介助加算');
          if(!isBasic&&!isBath) continue;
          const endTime=currentEndTime||facilityDefaultEndTime();
          for(let d=1; d<=31; d++){
            const ci=dateColMap[d];
            if(ci===undefined) continue;
            const val=String(row[ci]||'').trim();
            if(!val||val==='0') continue;
            if(isBasic){
              const dd=String(d).padStart(2,'0');
              let code='';
              const matched=basicMaster.find(m=>m.name===svcName);
              if(matched){
                code=String(matched.code||'');
              }else{
                const m=resolveServiceCodeByTime(currentStartTime||facilityDefaultStartTime(), endTime, residentName);
                if(m) code=String(m.code||'');
              }
              if(code){
                const payload={code, startTime:currentStartTime||facilityDefaultStartTime(), endTime};
                if(!dailyCodes[dd]){
                  dailyCodes[dd]=payload;
                }else if(_dailyEntryCode(dailyCodes[dd])!==code){
                  dailyCodes[dd+'_2']=payload;
                }
              }
            }
            if(isBath){
              bathDays[d-1]=1;
            }
          }
        }
        resident.dailyServiceCodes[yyyymm]=dailyCodes;
        resident.bathSched=bathDays;
        resident._u=Date.now();
        results.push({
          file:file.name,
          status:'ok',
          msg:`${residentName}：${Object.keys(dailyCodes).length}日分のコード・入浴${bathDays.filter(v=>v).length}日を取込`
        });
      }catch(err){
        results.push({file:file.name, status:'error', msg:String(err.message||err)});
      }
      done++;
      checkDone();
    };
    reader.readAsArrayBuffer(file);
  });
  function checkDone(){
    if(done<total) return;
    // 取込成功した利用者の _u を現在時刻に更新してpushを確実に走らせる
    const now=Date.now();
    results.filter(r=>r.status==='ok').forEach(res=>{
      const resName=res.msg.split('：')[0];
      const resident=(db.residents||[]).find(r=>
        normalizeResidentName(r.name)===normalizeResidentName(resName));
      if(resident) resident._u=now;
    });
    saveDB();
    const ok=results.filter(r=>r.status==='ok').length;
    const skip=results.filter(r=>r.status==='skip').length;
    const err=results.filter(r=>r.status==='error').length;
    const detail=results.map(r=>`${r.status==='ok'?'✅':r.status==='skip'?'⚠️':'❌'} ${r.msg}`).join('\n');
    alert(`取込完了\n✅成功:${ok}件 ⚠️スキップ:${skip}件 ❌エラー:${err}件\n\n${detail}`);
    renderScheduleScreen();
  }
}

function renderScheduleScreen(){
  const lbl=document.getElementById('schedMonthLabel');
  const body=document.getElementById('scheduleBody');
  const sel=document.getElementById('schedResSelect');
  if(lbl) lbl.textContent=`${schedYear}年${schedMonth+1}月`;
  if(!body||!sel) return;
  const name=sel.value;
  const resident=(db.residents||[]).find(r=>normalizeResidentName(r.name)===normalizeResidentName(name))||dbResidentByNameLoose(name);
  if(!resident){
    body.innerHTML='<div class="text-gray">利用者を選択してください</div>';
    return;
  }
  _ensureResidentBillingFields(resident);
  const yyyymm=`${schedYear}-${pad(schedMonth+1)}`;
  const stDef=_cleanTimeHHMM(resident.startTime)||facilityDefaultStartTime();
  const etDef=_cleanTimeHHMM(resident.endTime)||facilityDefaultEndTime();
  let svcKey=String(resident.serviceCodeKey||'').trim();
  if(!svcKey){
    const stEst=_cleanTimeHHMM(resident.startTime)||facilityDefaultStartTime();
    const etEst=_cleanTimeHHMM(resident.endTime)||facilityDefaultEndTime();
    const est=resolveServiceCodeByTime(stEst, etEst, resident.name);
    if(est) svcKey=String(est.code||'');
  }
  const daily=(resident.dailyServiceCodes||{})[yyyymm]||{};
  const codeSet=new Set();
  Object.values(daily).forEach(v=>{
    const c=_dailyEntryCode(v);
    if(c) codeSet.add(String(c));
  });
  if(codeSet.size===0){
    const m=resolveServiceCodeByTime(stDef, etDef, resident.name);
    if(m) codeSet.add(String(m.code||''));
    else if(svcKey) codeSet.add(String(svcKey));
  }
  if(!svcKey&&codeSet.size) svcKey=[...codeSet][0];
  if(!svcKey){
    body.innerHTML='<p style="color:var(--text2);padding:12px;">介護度と利用時間を設定してください（利用者基本情報タブ）</p>';
    return;
  }
  const S=db.settings||{};
  const basics=(_svcMaster().basic||[]);
  const addonsM=(_svcMaster().addons||[]);
  const shoguM=(_svcMaster().shogu||[]);
  const days=new Date(schedYear,schedMonth+1,0).getDate();
  const wdJp=['日','月','火','水','木','金','土'];
  const officeAddons=Array.isArray(S.officeAddonCodes)?S.officeAddonCodes:[];
  const shoguCode=String(S.officeShoguCode||'').trim();
  const thNums=[...Array(days)].map((_,i)=>`<th style="border:1px solid var(--border1);padding:4px 6px;">${i+1}</th>`).join('');
  const thWds=[...Array(days)].map((_,i)=>{
    const wd=new Date(schedYear,schedMonth,i+1).getDay();
    return `<th style="border:1px solid var(--border1);padding:4px 6px;">${wdJp[wd]}</th>`;
  }).join('');
  const basicCodes=[...codeSet].sort();
  const resNm=resident.name;
  const schedArr=resident.sched||[];
  const bathArr=resident.bathSched||[];

  // コードの提供時間（分）をdailyServiceCodesまたはデフォルト時間から取得
  function getCodeMinutesFromDaily(code){
    const yyyymmCsv=`${schedYear}-${String(schedMonth+1).padStart(2,'0')}`;
    const dailyM=(resident.dailyServiceCodes||{})[yyyymmCsv]||{};
    const entry=Object.entries(dailyM).find(([k,v])=>!k.endsWith('_2')&&_dailyEntryCode(v)===String(code));
    if(entry&&entry[1]&&typeof entry[1]==='object'){
      const s=_cleanTimeHHMM(entry[1].startTime);
      const e=_cleanTimeHHMM(entry[1].endTime);
      if(s&&e) return parseInt(e.slice(0,2))*60+parseInt(e.slice(2,4)) - (parseInt(s.slice(0,2))*60+parseInt(s.slice(2,4)));
    }
    // calcStartTime/calcEndTimeから取得
    for(let i=0;i<days;i++){
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(i+1)}`;
      const rec=getRec(resNm,dkKey);
      if(rec.calculated!==true) continue;
      if(String(rec.calcServiceCodeKey||'').trim()!==String(code)) continue;
      const s=_cleanTimeHHMM(rec.calcStartTime);
      const e=_cleanTimeHHMM(rec.calcEndTime);
      if(s&&e) return parseInt(e.slice(0,2))*60+parseInt(e.slice(2,4)) - (parseInt(s.slice(0,2))*60+parseInt(s.slice(2,4)));
    }
    // デフォルト時間
    const s=_cleanTimeHHMM(stDef); const e=_cleanTimeHHMM(etDef);
    return parseInt(e.slice(0,2))*60+parseInt(e.slice(2,4)) - (parseInt(s.slice(0,2))*60+parseInt(s.slice(2,4)));
  }

  // 月内の実績コードをスキャンして予定にないコードを抽出
  const extraCodesSet=new Set();
  for(let i=0;i<days;i++){
    const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(i+1)}`;
    const rec=getRec(resNm, dkKey);
    if(rec.calculated!==true) continue;
    const ck=String(rec.calcServiceCodeKey||'').trim();
    if(ck && !basicCodes.includes(ck)) extraCodesSet.add(ck);
    const addons=Array.isArray(rec.calcAddons)?rec.calcAddons:[];
    addons.forEach(ac=>{
      const acStr=String(ac||'').trim();
      if(!acStr) return;
      if(acStr==='785301'||acStr==='785303') return; // 入浴は別途
      if(acStr==='785611'||acStr==='785612') return; // 送迎・同一建物減算は別途行があるので除外
      if(!officeAddons.includes(acStr)) extraCodesSet.add('__addon__'+acStr);
    });
    // 入浴は既存の入浴介助加算行で対応するため__bath__は追加しない
  }

  // 基本コードを提供時間の短い順に並べ替え
  const basicCodesSorted=[...basicCodes].sort((a,b)=>getCodeMinutesFromDaily(a)-getCodeMinutesFromDaily(b));
  // 実績追加コードも提供時間の短い順（加算・入浴は末尾）
  const extraCodesSorted=[...extraCodesSet].sort((a,b)=>{
    if(a.startsWith('__')&&!b.startsWith('__')) return 1;
    if(!a.startsWith('__')&&b.startsWith('__')) return -1;
    if(a.startsWith('__')&&b.startsWith('__')) return 0;
    return getCodeMinutesFromDaily(a)-getCodeMinutesFromDaily(b);
  });

  function dayMatchesBasicRow(dd, rowCode){
    const e1=daily[dd], e2=daily[dd+'_2'];
    if(e1&&_dailyEntryCode(e1)===String(rowCode)) return true;
    if(e2&&_dailyEntryCode(e2)===String(rowCode)) return true;
    if(Object.keys(daily).length===0) return codeSet.size===1&&[...codeSet][0]===String(rowCode);
    return false;
  }

  function rowPair(timeRangeHtml, labelSvc,getYotei,getJisseki,opts){
    opts=opts||{};
    const jissekiMode=opts.jissekiMode||'none';
    const jissekiAddonCode=opts.jissekiAddonCode;
    const yoteiMode=opts.yoteiMode||'none';
    const rowBasicCode=opts.rowBasicCode;
    const cellWt=v=>{
      const s=String(v==null?'':v).trim();
      if(!s) return 0;
      const n=parseInt(s,10);
      return Number.isFinite(n)?n:0;
    };
    let cntY=0,cntJ=0;
    const yCells=[];
    const jCells=[];
    for(let i=0;i<days;i++){
      const y=getYotei(i);
      const j=getJisseki(i);
      cntY+=cellWt(y);
      cntJ+=cellWt(j);
      const wd=new Date(schedYear,schedMonth,i+1).getDay();
      const bg=wd===0?'background:#FFE0E8':(wd===6?'background:#DDEEFF':'');
      const bs='text-align:center;border:1px solid var(--border1);'+bg;
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(i+1)}`;
      let yOnclick='';
      if(yoteiMode==='basic'){
        const rc=escapeAttr(String(rowBasicCode||''));
        yOnclick=` onclick="toggleScheduleYotei('${escapeAttr(resNm)}','${escapeAttr(dkKey)}','${rc}','yotei')" style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else if(yoteiMode==='bath'){
        yOnclick=` onclick="toggleScheduleBath('${escapeAttr(resNm)}','${escapeAttr(dkKey)}','yotei')" style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else if(yoteiMode==='schedPlain'){
        yOnclick=` onclick="toggleScheduleYotei('${escapeAttr(resNm)}','${escapeAttr(dkKey)}','','yotei')" style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else{
        yOnclick=` style="${bs};font-weight:700;"`;
      }
      yCells.push(`<td${yOnclick}>${y}</td>`);
      let jOnclick='';
      if(jissekiMode==='basic'){
        jOnclick=` onclick='toggleScheduleJisseki(${JSON.stringify(resNm)}, ${JSON.stringify(dkKey)})' style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else if(jissekiMode==='bath'){
        jOnclick=` onclick="toggleScheduleBath('${escapeAttr(resNm)}','${escapeAttr(dkKey)}','jisseki')" style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else if(jissekiMode==='addon'&&jissekiAddonCode){
        jOnclick=` onclick='toggleScheduleAddonJisseki(${JSON.stringify(resNm)}, ${JSON.stringify(dkKey)}, ${JSON.stringify(String(jissekiAddonCode))})' style="${bs};font-weight:700;cursor:pointer;user-select:none;"`;
      }else{
        jOnclick=` style="${bs};font-weight:700;"`;
      }
      jCells.push(`<td${jOnclick}>${j}</td>`);
    }
    return `<tr>
      <td rowspan="2" style="border:1px solid var(--border1);vertical-align:middle;padding:6px;">${timeRangeHtml}</td>
      <td rowspan="2" style="border:1px solid var(--border1);vertical-align:middle;padding:6px;">${escapeHtml(labelSvc)}</td>
      <td style="font-size:11px;color:var(--text3);border:1px solid var(--border1);">予定</td>
      ${yCells.join('')}
      <td rowspan="2" style="text-align:center;border:1px solid var(--border1);vertical-align:middle;padding:4px 8px;line-height:1.35;">
        <div style="font-size:11px;color:var(--text3);">予定</div>
        <div style="font-weight:700;font-size:13px;">${cntY}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:6px;">実績</div>
        <div style="font-weight:700;font-size:13px;">${cntJ}</div>
      </td>
    </tr>
    <tr>
      <td style="font-size:11px;color:var(--text3);border:1px solid var(--border1);">実績</td>
      ${jCells.join('')}
    </tr>`;
  }

  let html=`<table style="border-collapse:collapse;font-size:13px;white-space:nowrap;">
  <thead>
    <tr>
      <th rowspan="2" style="border:1px solid var(--border1);padding:6px;">提供時間</th>
      <th rowspan="2" style="border:1px solid var(--border1);padding:6px;">サービス内容</th>
      <th rowspan="2" style="border:1px solid var(--border1);"></th>
      ${thNums}
      <th rowspan="2" style="border:1px solid var(--border1);padding:6px;text-align:center;">予実<br>合計</th>
    </tr>
    <tr>${thWds}</tr>
  </thead>
  <tbody>`;

  basicCodesSorted.forEach(basicCode=>{
    const masterEntry=basics.find(m=>String(m.code)===String(basicCode));
    const labelSvc=masterEntry?String(masterEntry.name||''):String(basicCode);
    let rowStart=stDef, rowEnd=etDef;
    const firstEnt=Object.entries(daily).find(([k,v])=>v&&!String(k).endsWith('_2')&&_dailyEntryCode(v)===String(basicCode));
    if(firstEnt&&firstEnt[1]&&typeof firstEnt[1]==='object'){
      rowStart=_cleanTimeHHMM(firstEnt[1].startTime)||stDef;
      rowEnd=_cleanTimeHHMM(firstEnt[1].endTime)||etDef;
    }
    const timeRangeHtml=escapeHtml(`${_fmtTimeColon(rowStart)}〜${_fmtTimeColon(rowEnd)}`);
    html+=rowPair(timeRangeHtml,labelSvc,(dayIdx)=>{
      const dd=pad(dayIdx+1);
      if(schedArr[dayIdx]!==1) return '';
      return dayMatchesBasicRow(dd, basicCode)?'1':'';
    },(dayIdx)=>{
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
      const rec=getRec(resident.name,dkKey);
      if(rec.calculated!==true) return '';
      const ck=String(rec.calcServiceCodeKey||'').trim();
      const ok=ck?ck===String(basicCode):codeSet.size===1&&[...codeSet][0]===String(basicCode);
      return ok?'1':'';
    },{yoteiMode:'basic',jissekiMode:'basic',rowBasicCode:String(basicCode)});
  });

  officeAddons.forEach(code=>{
    if(code==='785301'||code==='785303') return;
    const ad=addonsM.find(x=>String(x.code||'')===String(code));
    const nm=ad?String(ad.name||code):code;
    html+=rowPair('', nm,(dayIdx)=>(schedArr[dayIdx]===1?'1':''),(dayIdx)=>{
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
      const rec=getRec(resident.name,dkKey);
      if(rec.calculated!==true) return '';
      const list=Array.isArray(rec.calcAddons)?rec.calcAddons:[];
      return list.includes(code)?'1':'';
    },{yoteiMode:'schedPlain',jissekiMode:'addon',jissekiAddonCode:code});
  });

  html+=rowPair('', '入浴介助加算Ⅰ',(dayIdx)=>(bathArr[dayIdx]===1?'1':''),(dayIdx)=>{
    const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
    return getRec(resident.name,dkKey).bathCalculated?'1':'';
  },{yoteiMode:'bath',jissekiMode:'bath'});

  // 実績のみ発生したコードの行を追加
  extraCodesSorted.forEach(ec=>{
    if(ec==='__bath__'){
      html+=rowPair('','入浴介助加算Ⅰ',
        ()=>'',
        (dayIdx)=>{
          const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
          const rec=getRec(resNm,dkKey);
          return (rec.calculated===true&&rec.bathCalculated&&bathArr[dayIdx]!==1)?'1':'';
        },{yoteiMode:'none',jissekiMode:'bath'});
    } else if(ec.startsWith('__addon__')){
      const acCode=ec.replace('__addon__','');
      const ad=addonsM.find(x=>String(x.code||'')===acCode);
      const nm=ad?String(ad.name||acCode):acCode;
      html+=rowPair('',nm,
        ()=>'',
        (dayIdx)=>{
          const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
          const rec=getRec(resNm,dkKey);
          if(rec.calculated!==true) return '';
          return (Array.isArray(rec.calcAddons)&&rec.calcAddons.includes(acCode))?'1':'';
        },{yoteiMode:'none',jissekiMode:'addon',jissekiAddonCode:acCode});
    } else {
      const masterEntry=basics.find(m=>String(m.code)===ec);
      const nm=masterEntry?String(masterEntry.name||ec):ec;
      html+=rowPair('',nm,
        ()=>'',
        (dayIdx)=>{
          const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
          const rec=getRec(resNm,dkKey);
          if(rec.calculated!==true) return '';
          return String(rec.calcServiceCodeKey||'').trim()===ec?'1':'';
        },{yoteiMode:'none',jissekiMode:'basic'});
    }
  });


  const transportValue=(resident.transportType==='none')?'2':'1';
  const showTransportRow=!resident.sameBuilding && resident.transportType!=='both';
  if(showTransportRow){
    html+=rowPair('', '地域通所介護送迎減算（'+(resident.transportType==='none'?'両道':'片道')+'）',
      (dayIdx)=>(schedArr[dayIdx]===1?transportValue:''),
      (dayIdx)=>{
        const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
        const rec=getRec(resident.name,dkKey);
        if(rec.calculated!==true) return '';
        const list=Array.isArray(rec.calcAddons)?rec.calcAddons:[];
        if(!list.includes('785612')) return '';
        // calcTransportTypeを優先して回数を表示
        const tp=String(rec.calcTransportType||resident.transportType||'both');
        return tp==='none'?'2':'1';
      },{yoteiMode:'schedPlain',jissekiMode:'addon',jissekiAddonCode:'785612'});
  }
  if(resident.sameBuilding){
    html+=rowPair('', '地域通所介護同一建物減算',(dayIdx)=>(schedArr[dayIdx]===1?'1':''),(dayIdx)=>{
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(dayIdx+1)}`;
      const rec=getRec(resident.name,dkKey);
      if(rec.calculated!==true) return '';
      const list=Array.isArray(rec.calcAddons)?rec.calcAddons:[];
      return list.includes('785611')?'1':'';
    },{yoteiMode:'schedPlain',jissekiMode:'addon',jissekiAddonCode:'785611'});
  }

  if(shoguCode){
    const sg=shoguM.find(x=>String(x.code||'')===shoguCode);
    const nm=sg?String(sg.name||shoguCode):shoguCode;
    let firstNum=-1;
    for(let d=1;d<=days;d++){
      const dkKey=`${schedYear}-${pad(schedMonth+1)}-${pad(d)}`;
      if(getRec(resident.name,dkKey).calculated===true){ firstNum=d; break; }
    }
    html+=rowPair('', nm,(dayIdx)=>(dayIdx===0?'1':''),(dayIdx)=>((firstNum===dayIdx+1)?'1':''));
  }

  html+='</tbody></table>';
  body.innerHTML=html;
}

function execCSVExport(){
  const S=db.settings||{};
  const officeNumber=String(S.officeNumber||'').trim();
  const serviceTypeCode=String(S.serviceTypeCode||'').trim();
  if(!officeNumber){
    alert('請求設定に「自事業所番号」が未設定です。');
    return;
  }
  const targetYm=`${schedYear}${String(schedMonth+1).padStart(2,'0')}`;
  const daysInMonth=new Date(schedYear,schedMonth+1,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  const ts=todayStr+String(today.getHours()).padStart(2,'0')
    +String(today.getMinutes()).padStart(2,'0')
    +String(today.getSeconds()).padStart(2,'0');

  const checkedNames=[...document.querySelectorAll('.csv-export-chk:checked')]
    .map(cb=>cb.getAttribute('data-res-name'));

  if(!checkedNames.length){
    alert('利用者を選択してください');
    return;
  }

  const csvLines=[];

  checkedNames.forEach(nm=>{
    const resident=(db.residents||[]).find(r=>normalizeResidentName(r.name)===normalizeResidentName(nm));
    if(!resident) return;
    _ensureResidentBillingFields(resident);

    let shoguAdded=false;
    const resName=resident.name;
    const cmOffice=_cleanDigits(resident.careManagerOffice||'');
    const cmName=String(resident.careManagerName||'').trim();
    const insured=_cleanDigits(resident.insuredNumber||'');
    const st=_cleanTimeHHMM(resident.startTime)||facilityDefaultStartTime();
    const et=_cleanTimeHHMM(resident.endTime)||facilityDefaultEndTime();
    const yyyymmCsv=`${schedYear}-${String(schedMonth+1).padStart(2,'0')}`;

    for(let d=1;d<=daysInMonth;d++){
      const dateKey=`${schedYear}-${String(schedMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dateStr=`${schedYear}${String(schedMonth+1).padStart(2,'0')}${String(d).padStart(2,'0')}`;
      const rec=getRec(resName, dateKey);
      if(rec.calculated!==true) continue;

      const dd=String(d).padStart(2,'0');
      const dailyM=(resident.dailyServiceCodes||{})[yyyymmCsv]||{};
      let dayEntry=dailyM[dd];
      const calcCk=String(rec.calcServiceCodeKey||'').trim();
      if(dailyM[dd]&&dailyM[dd+'_2']){
        const c1=_dailyEntryCode(dailyM[dd]);
        const c2=_dailyEntryCode(dailyM[dd+'_2']);
        if(calcCk&&(calcCk===c1||calcCk===c2)){
          dayEntry=(calcCk===c2)?dailyM[dd+'_2']:dailyM[dd];
        }
      }
      let recSt, recEt, scKey;
      if(dayEntry&&_dailyEntryCode(dayEntry)){
        scKey=_dailyEntryCode(dayEntry);
        const ent=typeof dayEntry==='object'?dayEntry:null;
        recSt=_cleanTimeHHMM(ent&&ent.startTime)||_cleanTimeHHMM(rec.calcStartTime)||st;
        recEt=_cleanTimeHHMM(ent&&ent.endTime)||_cleanTimeHHMM(rec.calcEndTime)||et;
      }else{
        recSt=_cleanTimeHHMM(rec.calcStartTime)||st;
        recEt=_cleanTimeHHMM(rec.calcEndTime)||et;
        scKey=String(rec.calcServiceCodeKey||resident.serviceCodeKey||'').trim();
        if(!scKey){
          const m=resolveServiceCodeByTime(recSt, recEt, resName);
          if(m) scKey=String(m.code||'');
        }
      }
      if(!scKey){
        const m=resolveServiceCodeByTime(recSt, recEt, resName);
        if(m) scKey=String(m.code||'');
      }
      if(!scKey) continue;
      const unit=getServiceUnitByCode(scKey);

      csvLines.push([
        '202407', S.prefCode||'412023', insured,
        todayStr, targetYm, cmOffice, cmName,
        unit, '', dateStr, '',
        recSt, recEt, '1', scKey,
        '', '', '', '',
        officeNumber, S.facilityName||'', '', '0', officeNumber, ''
      ].join(','));

      // 入浴以外のcalcAddonsを取得
      let addons=Array.isArray(rec.calcAddons)?[...rec.calcAddons]:[];
      addons=addons.filter(c=>String(c)!=='785301'&&String(c)!=='785303');
      // 入浴はbathCalculatedで判定
      if(rec.bathCalculated){
        addons.push('785301');
      }
      addons.forEach(addonCode=>{
        const c=String(addonCode||'').trim();
        if(!c) return;
        const deducts=(_svcMaster().deducts)||[];
        const dm=deducts.find(d=>String(d.code)===c);
        const am=(_svcMaster().addons||[]).find(d=>String(d.code)===c);
        let addonCount='1';
        let addonUnit;
        if(c==='785612'){
          // 送迎減算：calcTransportTypeを優先、なければresidentのtransportType
          addonUnit=-47;
          const tp=String(rec.calcTransportType||resident.transportType||'both');
          addonCount=(tp==='none')?'2':'1'; // 送迎なし=両道=2、片道=1
        }else if(dm){
          addonUnit=dm.unit;
        }else if(am){
          addonUnit=am.unit;
        }else{
          addonUnit=getAddonOrDeductUnit(c);
        }
        csvLines.push([
          '202407', S.prefCode||'412023', insured,
          todayStr, targetYm, cmOffice, cmName,
          addonUnit, '', dateStr, '',
          recSt, recEt, addonCount, c,
          '', '', '', '',
          officeNumber, S.facilityName||'', '', '0', officeNumber, ''
        ].join(','));
      });

      const shC=String(S.officeShoguCode||'').trim();
      const shU=Math.max(0,Number(S.officeShoguUnit||0)||0);
      if(!shoguAdded && shC && shU>0){
        csvLines.push([
          '202407', S.prefCode||'412023', insured,
          todayStr, targetYm, cmOffice, cmName,
          shU, '', dateStr, '',
          '9999', '9999', '1', shC,
          '', '', '', '',
          officeNumber, S.facilityName||'', '', '0', officeNumber, ''
        ].join(','));
        shoguAdded=true;
      }
    }
  });

  if(!csvLines.length){
    alert('出力対象の算定データがありません。');
    return;
  }

  const fname=`UPJSK_${targetYm}_${officeNumber}_${serviceTypeCode||'78'}_43_${ts}.CSV`;
  downloadCSVasShiftJIS(csvLines.join('\r\n')+'\r\n', fname);
  closeMainOv();
  showBriefToast(`${fname} を出力しました`, 2500, false);
}

function downloadCSVasShiftJIS(csvContent, filename){
  const text=String(csvContent||'');
  try{
    if(typeof Encoding==='undefined' || !Encoding || typeof Encoding.convert!=='function'){
      console.warn('encoding-japanese not loaded; fallback to UTF-8 download');
      showBriefToast('Shift-JIS変換ライブラリ未読込のためUTF-8で出力しました（取込エラーの可能性）', 4500, true);
      downloadTextFile(text, filename);
      return;
    }
    const unicodeArray = Encoding.stringToCode(text);
    const sjisArray = Encoding.convert(unicodeArray, { to: 'SJIS', from: 'UNICODE' });
    const uint8Array = new Uint8Array(sjisArray);
    const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift_jis;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){
    console.error(e);
    showBriefToast('Shift-JIS変換に失敗したためUTF-8で出力しました', 3500, true);
    downloadTextFile(text, filename);
  }
}
function downloadTextFile(text, filename){
  const blob=new Blob([String(text||'')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function calcMealIntakeTotalPercent(rec, residentName){
  if(!rec||!rec.meal) return null;
  const m=rec.meal||{};
  const isDayRes=residentName?isDayServiceByName(residentName):false;
  let vals;
  if(isDayRes){
    // デイサービス利用者は昼食のみを基本とし、朝食・夕食は明示入力があるときのみ平均に含める
    vals=[m.main,m.side].map(v=>Number(v)).filter(v=>Number.isFinite(v));
    if(mealSectionExplicitlyRecorded(m,'breakfast')){
      [m.bMain,m.bSide].forEach(v=>{const n=Number(v);if(Number.isFinite(n)) vals.push(n);});
    }
    if(mealSectionExplicitlyRecorded(m,'dinner')){
      [m.dMain,m.dSide].forEach(v=>{const n=Number(v);if(Number.isFinite(n)) vals.push(n);});
    }
  } else {
    vals=[m.bMain,m.bSide,m.main,m.side,m.dMain,m.dSide]
      .map(v=>Number(v))
      .filter(v=>Number.isFinite(v));
  }
  if(!vals.length) return null;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const clamped=Math.max(0,Math.min(100,avg));
  return Math.round(clamped);
}

/** YYYY-MM-DD + HH:mm をローカルの Unix ms に（時刻に秒が付くと ISO 連結が二重になり env によって Invalid になり得る） */
function timestampFromDateKeyAndHm(dkStr, hmNorm){
  const ymd=String(dkStr||'').trim().split('-').map(Number);
  if(ymd.length!==3||ymd.some(n=>!Number.isFinite(n))) return NaN;
  const hm=String(hmNorm||'00:00').trim();
  const m=hm.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return NaN;
  return new Date(ymd[0], ymd[1]-1, ymd[2], Number(m[1]), Number(m[2]), 0, 0).getTime();
}
function getLastStool(name){
  // 過去14日間を遡って最終排便を探す
  for(let d=0;d<=13;d++){
    const dt=new Date(curDate); dt.setDate(dt.getDate()-d);
    const dayData=getRecordInDayByResidentName(db.records[dk(dt)]||{},name);
    if(dayData&&dayData.excretion){
      const found=dayData.excretion.filter(e=>e.stool&&e.stool!=='なし');
      if(found.length){
        const e=found[found.length-1];
        const et=normalizeTimeText(e.time)||'00:00';
        const ts=timestampFromDateKeyAndHm(dk(dt), et);
        return {dt:ts, dk:dk(dt), dayStr:['日','月','火','水','木','金','土'][dt.getDay()], time:et};
      }
    }
  }
  return null;
}

function recordDayHasMainListData(rec){
  if(!rec||typeof rec!=='object') return false;
  if((rec.vital||[]).length) return true;
  if((rec.excretion||[]).length) return true;
  if((rec.bath||[]).length) return true;
  if((rec.care||[]).length) return true;
  if((rec.notes||[]).some(n=>isActiveNote(n))) return true;
  if(rec.meal&&mealRowHasDataOrSyncMeta(rec.meal)) return true;
  const med=rec.med||{};
  if(['morning','lunch','dinner','bedtime'].some(t=>{
    const x=med[t];
    if(!x) return false;
    if((x.items||[]).length) return true;
    return !!(String(x.time||'').trim()||String(x.staff||'').trim());
  })) return true;
  if(rec.rec&&(String(rec.rec.content||'').trim()||(rec.rec.chips||[]).length||String(rec.rec.part||'').trim()||String(rec.rec.time||'').trim()))
    return true;
  if(String(rec.day||'').trim()) return true;
  return false;
}

/**
 * 利用者を氏名順に。
 * @param dayIdx カレンダー上の日（0始まり＝1日）
 * @param opts.forMainTable true のとき、選択日が「今日」より前なら、スケジュール外・削除済みでもその日の記録があれば一覧に含める（メイン画面の履歴表示用）
 */
function residentsOnDaySorted(dayIdx, opts){
  const fromSched=(db.residents||[]).filter(r=>
    (r.sched&&r.sched[dayIdx]===1)||
    getResidentClassification(r.name)==='inpatient'
  );
  if(!opts||!opts.forMainTable){
    return fromSched.slice().sort(compareResidentsStable);
  }
  const selKey=dk();
  const todayKey=dk(new Date());
  if(selKey>=todayKey){
    return fromSched.slice().sort(compareResidentsStable);
  }
  const byName=new Map();
  fromSched.forEach(r=>{
    const nm=normalizeResidentName(r.name);
    if(nm) byName.set(nm,Object.assign({},r,{_mainGhost:false}));
  });
  const dayRec=db.records[selKey]||{};
  Object.keys(dayRec).forEach(rawName=>{
    const nm=normalizeResidentName(rawName);
    if(!nm||byName.has(nm)) return;
    const rec=dayRec[rawName];
    if(!recordDayHasMainListData(rec)) return;
    const rr=(db.residents||[]).find(x=>normalizeResidentName(x.name)===nm);
    if(rr) byName.set(nm,Object.assign({},rr,{_mainGhost:false}));
    else byName.set(nm,{id:'',name:String(rawName).trim(),care:'',sched:[],_u:0,_mainGhost:true});
  });
  return [...byName.values()].sort(compareResidentsStable);
}

    const rc=(rec.rec&&(rec.rec.content||(rec.rec.chips&&rec.rec.chips.length)))?'<span class="cell-ok">○</span>':'<span class="cell-empty">—</span>';
    // 服薬
    const med=rec.med||{};
    const _mItems=t=>((med[t]&&med[t].items)||[]).map(s=>String(s||'').trim()).filter(Boolean);
    const _mReal=t=>_mItems(t).some(i=>i!=='服薬なし');
    const _mNone=t=>{
      const it=_mItems(t);
      return it.length>0 && it.every(i=>i==='服薬なし');
    };
    const _isToday=dk()===dk(new Date());
    const _nowH=new Date().getHours()+new Date().getMinutes()/60;
    const _mParts=[];
    [{t:'morning',th:8},{t:'lunch',th:12},{t:'dinner',th:18},{t:'bedtime',th:21}].forEach(({t,th})=>{
      if(_mReal(t)) _mParts.push('<span style="color:var(--blue);font-weight:700;">✔</span>');
      else if(_mNone(t)) _mParts.push('<span style="color:var(--text3);font-weight:700;">ー</span>');
      else if(_isToday&&_nowH>=th) _mParts.push('<span style="color:var(--orange2);font-weight:700;">？</span>');
    });
    const mdc=_mParts.length?`<span class="cell-val" style="font-size:18px;letter-spacing:1px;">${_mParts.join('')}</span>`:'<span class="cell-empty">—</span>';
    const showMainDelBtn=!r._mainGhost && getResidentClassification(r.name)!=='inpatient';

    return `<tr data-res-name="${escapeAttr(r.name)}">
      <td style="width:36px;min-width:36px;padding:4px;text-align:center;">${yoteiCell}</td>
      <td style="width:36px;min-width:36px;padding:4px;text-align:center;">${jissekiCell}</td>
      <td style="width:32px;min-width:32px;padding:4px;">${nc}</td>

        <div class="name-cell-inner">

          ${showMainDelBtn?`<button type="button" class="res-del-btn no-print" title="この日の一覧から外す">×</button>`:''}
        </div>

      <td class="res-div-r">${sc}</td>
      <td>${ec}</td>

    </tr>`;
  }).join('');
  // ＋ 利用者追加行（最下部・氏名列に配置）

function getResidentsForCurrentDate(){
  const dayIdx=curDate.getDate()-1;

  if(curRes){
    const has=list.some(r=>normalizeResidentName(r.name)===normalizeResidentName(curRes));

function setupSwipeOnPanel(){
  const panel=document.getElementById('detPanel');
  if(!panel||panel._swipeSetup) return;
  panel._swipeSetup=true;
  let touchStart=null;
  let isHorizontalSwipe=false;
  let startX=0;
  panel.addEventListener('touchstart',function(e){
    if(!e.touches||e.touches.length!==1) return;
    const t=e.touches[0];
    startX=t.clientX;
    touchStart={x:t.clientX,y:t.clientY,time:Date.now()};
    isHorizontalSwipe=false;
  },{passive:true});
  panel.addEventListener('touchmove',function(e){
    if(!touchStart||!e.touches||e.touches.length!==1) return;
    const t=e.touches[0];
    const dx=t.clientX-touchStart.x;
    const dy=t.clientY-touchStart.y;
    if(!isHorizontalSwipe&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){
      isHorizontalSwipe=true;
    }
    if(isHorizontalSwipe){
      try{e.preventDefault();}catch(_){}
    }
  },{passive:false});
  panel.addEventListener('touchend',function(e){
    if(!touchStart) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-touchStart.x;
    const dy=t.clientY-touchStart.y;
    const dt=Date.now()-touchStart.time;
    const sX=startX;
    touchStart=null;
    isHorizontalSwipe=false;
    if(Math.abs(dx)<50) return;
    if(Math.abs(dx)<Math.abs(dy)*1.2) return;
    if(dt>1000) return;
    if(sX<20) return;
    const residents=getResidentsForCurrentDate();
    const idx=residents.findIndex(r=>normalizeResidentName(r.name)===normalizeResidentName(curRes));
    if(idx===-1) return;
    if(dx<0){
      if(idx>=residents.length-1){
        showBriefToast('最後の利用者です',2000,false);
      }else{
        switchToResident(residents[idx+1].name,'left');
      }
    }else{
      if(idx<=0){
        showBriefToast('最初の利用者です',2000,false);
      }else{
        switchToResident(residents[idx-1].name,'right');
      }
    }
  },{passive:true});
}

// ========== 48時間履歴取得（選択日＝「当日」の終わりを基準に72時間以内） ==========
/** 日付選択で選んだ日を「当日」とみなしたときの、その日の終わり（ローカル 23:59:59.999） */
function historyRefEndMs(){
  const t=new Date(curDate);
  t.setHours(23,59,59,999);
  return t.getTime();
}
/** 記録1件の比較用タイムスタンプ（日付キー＋時刻、または ts 文字列） */
function recordItemTsMs(dkStr, item){
  if(item&&item.ts){
    const x=Date.parse(String(item.ts));
    if(!isNaN(x)) return x;
  }
  return new Date(dkStr+'T'+(item&&item.time||'00:00')+':00').getTime();
}
function get48h(name, field){
  const refEnd=historyRefEndMs(), limit=72*3600000, all=[];
  for(let d=0;d<=2;d++){
    const dt=new Date(curDate); dt.setDate(dt.getDate()-d);
    const k=dk(dt);
    const dayData=db.records[k]&&db.records[k][name];
    if(!dayData||!dayData[field]) continue;
    dayData[field].forEach((item,i)=>{
      if(field==='notes' && !isActiveNote(item)) return;
      const ts=recordItemTsMs(k, item);
      if(ts<=refEnd&&refEnd-ts<=limit) all.push(Object.assign({},item,{_dk:k,_i:i,_ts:ts}));
    });
  }
  return all.sort((a,b)=>b._ts-a._ts);
}
/** 48時間基準（排泄履歴と同じ）の卸記録。日付は正午でソート用タイムスタンプ化 */
function get48hSupplies(resName){
  const refEnd=historyRefEndMs(), limit=72*3600000, all=[];
  (db.supplies||[]).forEach(s=>{
    if(!s||s.resName!==resName) return;
    const dk=supplyDateCalendarKey(s.date);
    if(!dk) return;
    const ts=new Date(dk+'T12:00:00').getTime();
    if(ts<=refEnd&&refEnd-ts<=limit) all.push({...s,_dk:dk,_ts:ts,_kind:'supply'});
  });
  return all.sort((a,b)=>b._ts-a._ts);
}
/** 直近 n 暦日分の記録（バイタル・排泄履歴用。最大31日） */
function getNDayHistory(name, field, nDays){
  const n=Math.min(31, Math.max(1, Number(nDays)||6));
  const all=[];
  for(let d=0; d<n; d++){
    const dt=new Date(curDate); dt.setDate(dt.getDate()-d);
    const k=dk(dt);
    const dayData=db.records[k]&&db.records[k][name];
    if(!dayData||!dayData[field]) continue;
    dayData[field].forEach((item,i)=>{
      if(field==='notes' && !isActiveNote(item)) return;
      const ts=recordItemTsMs(k, item);
      all.push({...item,_dk:k,_i:i,_ts:ts});
    });
  }
  return all.sort((a,b)=>b._ts-a._ts);
}
function getNDaySupplies(resName, nDays){
  const n=Math.min(31, Math.max(1, Number(nDays)||6));
  const days=new Set();
  for(let d=0; d<n; d++){
    const dt=new Date(curDate); dt.setDate(dt.getDate()-d);
    days.add(dk(dt));
  }
  const all=[];
  (db.supplies||[]).forEach(s=>{
    if(!s||s.resName!==resName) return;
    const dkKey=supplyDateCalendarKey(s.date);
    if(!dkKey||!days.has(dkKey)) return;
    const ts=new Date(dkKey+'T12:00:00').getTime();
    all.push({...s,_dk:dkKey,_ts:ts,_kind:'supply'});
  });
  return all.sort((a,b)=>b._ts-a._ts);
}
function get48hMed(name){
  const refEnd=historyRefEndMs(), limit=72*3600000, all=[];
  const ORDER=['morning','lunch','dinner','bedtime'];
  for(let d=0;d<=2;d++){
    const dt=new Date(curDate); dt.setDate(dt.getDate()-d);
    const k=dk(dt);
    const dayData=db.records[k]&&db.records[k][name];
    if(!dayData||!dayData.med) continue;
    ORDER.forEach(t=>{
      const m=dayData.med[t];
      if(!m||!m.items||!m.items.length) return;
      const ts=recordItemTsMs(k, m);
      if(ts<=refEnd&&refEnd-ts<=limit) all.push({...m,_dk:k,_timing:t,_ts:ts});
    });
  }
  return all.sort((a,b)=>b._ts-a._ts);
}
function recDayLabel(dkStr){
  const dt=new Date(dkStr+'T12:00:00');
  return `${dt.getMonth()+1}/${pad(dt.getDate())}`;
}
function dateLabelWithWeek(dkStr){
  const dt=new Date(dkStr+'T12:00:00');
  const wd=['日','月','火','水','木','金','土'][dt.getDay()];
  return `${dt.getMonth()+1}/${pad(dt.getDate())}（${wd}）`;
}
function recordEditLabelByDate(dkStr){
  return `${dateLabelWithWeek(dkStr)}の履歴編集中`;
}
function recordEditLabelByDateTime(dkStr,timeStr){
  const base=dateLabelWithWeek(dkStr);
  const t=normalizeTimeText(timeStr||'');
  return `${base}${t||'--:--'}の履歴編集中`;
}
function hmFromTs(ts){
  const n=Number(ts||0);
  if(!n) return '';
  const d=new Date(n);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ========== スタッフ選択ビルド ==========
function buildStaffOpts(cur){

  if(!list.length) return '<option value="">（未登録）</option>';
  return '<option value="">── 担当者を選択 ──</option>'+

}
function buildStaffSelect(id, cur){
  const el=document.getElementById(id);
  if(el) el.innerHTML=buildStaffOpts(cur);
}
function normalizeTimeText(v){
  const s=String(v||'').trim();
  if(!s) return '';
  /** HH:mm または HH:mm:ss（シート・入力により秒が付く。旧実装は秒付きを素通しし T...:00 と二重になり Safari で Invalid になりやすい） */
  const hm=s.match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
  if(hm) return `${pad(Number(hm[1]))}:${pad(Number(hm[2]))}`;
  const t=Date.parse(s);
  if(!isNaN(t)){
    const d=new Date(t);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  return s;
}
function normalizeTempValue(v){
  let s=String(v||'').trim()
    .replace(/[，,]/g,'.')
    .replace(/[。．]/g,'.')
    .replace(/[^\d.]/g,'');
  if(!s) return '';
  // 0.xx / 0.xxx のような誤値は温度入力の省略記法として補正
  // 例: 0.37 -> 37.0 / 0.365 -> 36.5
  if(/^0\.\d{2,4}$/.test(s)){
    const d=s.slice(2);
    if(d.length===2) s=d+'.0';
    else if(d.length===3) s=d.slice(0,2)+'.'+d.slice(2);
    else s=d.slice(0,3)+'.'+d.slice(3);
  }
  if(/^\d{3,4}$/.test(s)) s=s.slice(0,-1)+'.'+s.slice(-1);
  if(/^\.\d{3,}$/.test(s)){
    const d=s.slice(1);
    s=d.slice(0,-1)+'.'+d.slice(-1);
  }
  if(/^\.\d+$/.test(s)) s='0'+s;
  const parts=s.split('.');
  if(parts.length>2) s=parts[0]+'.'+parts.slice(1).join('');
  return s;
}
function convTemp(el){
  // 入力中の強制変換はしない（カーソル飛びや誤変換防止）
  el.value=String(el.value||'').replace(/[，,]/g,'.').replace(/[。．]/g,'.');
}

// ========== バイタル表示（メイン表・履歴共通：しきい値で cell-warn / cell-red） ==========
function vitalSpanTemp(temp){
  const _t=normalizeTempValue(temp);
  const cls=parseFloat(_t)>=37.0?'cell-warn':'cell-val';
  return `<span class="${cls}">${_t||'—'}℃</span>`;
}
function vitalSpanBp(sbp,dbp){
  const _dbp=parseInt(String(dbp||'').trim(),10);
  const _sbp=parseInt(String(sbp||'').trim(),10);
  let bpCls='cell-val';
  if(Number.isFinite(_dbp)&&_dbp>100) bpCls='cell-red';
  else if(Number.isFinite(_sbp)&&_sbp>=160) bpCls='cell-warn';
  return `<span class="${bpCls}">${sbp||''}/${dbp||''}</span>`;
}
function vitalSpanPulse(pulse){
  const p=parseInt(String(pulse||'').trim(),10);
  const cls=Number.isFinite(p)&&p>=90?'cell-warn':'cell-val';
  return `<span class="${cls}">${pulse||''}</span>`;
}
function vitalSpanSpo2(spo2){
  return `<span class="cell-val">${spo2||'—'}%</span>`;
}

// ========== バイタルパネル ==========
let _editVital=null;
function buildVitalPanel(){
  const rec=getRec(curRes);
  const hist=getNDayHistory(curRes,'vital',6);
  const histRow=(v)=>`<div class="hist-item">
    <div class="hist-time">${recDayLabel(v._dk)} ${normalizeTimeText(v.time)}</div>
    <div class="hist-content">
      BP: ${vitalSpanBp(v.sbp,v.dbp)} mmHg　脈: ${vitalSpanPulse(v.pulse)}　体温: ${vitalSpanTemp(v.temp)}　SpO2: ${vitalSpanSpo2(v.spo2)}${v.weight?`　体重: ${v.weight}kg`:''}
    </div>
    <button class="hist-edit" onclick="editVital('${v._dk}',${v._i})">編集</button>
    <button class="hist-del" onclick="delVital('${v._dk}',${v._i})">削除</button>
  </div>`;
  const histTop=hist.slice(0,3).map(histRow).join('');
  const histMore=hist.slice(3).map(histRow).join('');
  const histToggle=hist.length>3
    ? `<button type="button" class="btn btn-gray btn-sm mt8" onclick="toggleVitalHistMore(this)">▼ さらに表示（${hist.length-3}件）</button>`
    : '';
  const histHtml=hist.length
    ? `${histTop}${histMore?`<div id="vitalHistMore" style="display:none;">${histMore}</div>`:''}${histToggle}`
    : '<div class="text-gray" style="font-size:14px;padding:8px 0;">記録なし</div>';

  const lv=rec.vital.length?rec.vital[rec.vital.length-1]:null;
  return `<div class="panel">
    <div class="panel-sec">
      <h3>6日以内の記録</h3>
      <div class="hist-list">${histHtml}</div>

function lwSentBadgeHtml(item){

  saveDB();
}
function clearRecordLwSent(rec){

function isLwFetchNetworkError(e){
  const m=String((e&&e.message)||e||'').toLowerCase();
  return !m||/failed to fetch|networkerror|network error|load failed|fetch failed|aborted|timeout|cors/.test(m);
}

/** LINE WORKS Bot でケア・申送りを在庫管理GAS（action: kaigo_lw）経由で送信 */
async function sendLwCareMessage(content, residentName, time){
  const url=zaikoGasUrl();
  if(!url){
    alert('LINEWORKS送信には「設定 › 在庫管理GAS URL」が必要です。\n（介護記録の同期GAS URLとは別です）');
    return false;
  }
  const body={
    token:    zaikoGasToken(),
    action:   'kaigo_lw',
    unit:     FAC ? FAC.storageKey : 'kaigo_nishi',
    resident: residentName || '',
    time:     time || '',
    content:  String(content||'').trim()
  };
  try{
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(body)
    });
    const t=await r.text();
    let j=null;
    try{ j=JSON.parse(t); }catch(_){}
    if(!r.ok){
      throw new Error('HTTP '+r.status+(t?': '+t.slice(0,120):''));
    }
    if(j&&j.ok===false){
      throw new Error(j.error||j.message||'GAS応答エラー');
    }
    showBriefToast('LINE WORKSへ送信しました',2200,false);
    return true;
  }catch(e){
    console.error('[LW送信エラー]', e, body);
    if(isLwFetchNetworkError(e)){
      showBriefToast('LINE WORKS送信を開始しました（応答は未確認）',2200,false);
      return true;
    }
    alert('LINE WORKSへの送信に失敗しました。\n'+e.message+'\n\n設定の「在庫管理GAS URL」が②在庫・LINEWORKS用デプロイか、トークンが一致しているか確認してください。');
    return false;
  }
}

    if(forwardToNotes){

      const notePayload={id:noteId,time,writer:staff,content,ts:new Date().toISOString(),_deleted:false,sheetU:Date.now()};
      const ni=(r.notes||[]).findIndex(n=>n&&n.id===noteId);
      if(ni>=0) r.notes[ni]={...(r.notes[ni]||{}),...notePayload};
      else{
        r.notes=r.notes||[];
        r.notes.push(notePayload);
      }
      r.care[_editCare.idx].forwardNoteId=noteId;
    }
    _editCare=null;
  }else{
  const r=getRec(curRes);
    const item={id:genId('c'),time,content,staff,forwardToNotes,sheetU:Date.now()};
    if(forwardToNotes){
      const noteId=genId('n');
      r.notes.push({id:noteId,time,writer:staff,content,ts:new Date().toISOString(),_deleted:false,sheetU:Date.now()});
      item.forwardNoteId=noteId;
    }
    r.care.push(item);
    lwTarget=item;
  }
  saveDB(); showSavedToast();
  if(shareToLw&&lwTarget){
    markRecordLwSent(lwTarget);
    sendLwCareMessage(content,curRes,time).then(ok=>{
      if(!ok) clearRecordLwSent(lwTarget);
      refreshPanel('care');
      goBack();
    });
    return;
  }
  goBack();
}
function delCare(dkStr,idx){

  const r=getRec(curRes,dkStr);
  const row=r.care&&r.care[idx];
  const id=row&&row.id;
  if(id) markRecordItemDeleted('c', id);
  r.care.splice(idx,1);
  saveDB(); refreshPanel('care');
}

// ========== 連絡帳写真（localStorage・同期対象外） ==========
function getPhotoStorageKey(name, dateKey){
  const fac=FACILITY_ID||'nishi';
  return `kaigo_photos_${fac}_${name}_${dateKey}`;
}
function getPhotosFor(name, dateKey){
  try{
    const raw=localStorage.getItem(getPhotoStorageKey(name, dateKey));
    if(!raw) return [];
    const arr=JSON.parse(raw);
    return Array.isArray(arr)?arr.slice(0,2):[];
  }catch(e){
    return [];
  }
}
function setPhotosFor(name, dateKey, photos){
  try{
    const key=getPhotoStorageKey(name, dateKey);
    const arr=(photos||[]).slice(0,2);
    if(arr.length===0) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(arr));
  }catch(e){
    alert('写真の保存に失敗しました。容量オーバーの可能性があります。');
  }
}
function addPhotoFor(name, dateKey, dataUrl){
  const existing=getPhotosFor(name, dateKey);
  if(existing.length>=2) return false;
  existing.push(dataUrl);
  setPhotosFor(name, dateKey, existing);
  return true;
}
function removePhotoFor(name, dateKey, index){
  const existing=getPhotosFor(name, dateKey);
  if(index<0||index>=existing.length) return;
  existing.splice(index, 1);
  setPhotosFor(name, dateKey, existing);
}
function resizePhotoDataUrl(dataUrl, maxWidth){
  return new Promise(function(resolve, reject){
    const img=new Image();
    img.onload=function(){
      const scale=Math.min(1, maxWidth/img.width);
      const w=Math.round(img.width*scale);
      const h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w;
      canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror=reject;
    img.src=dataUrl;
  });
}
function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    const reader=new FileReader();
    reader.onload=function(){ resolve(reader.result); };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function isPhotoOnDayPanel(){
  return FACILITY_ID==='minami';
}
function isPhotoOnPrintDialog(){
  return FACILITY_ID==='nishi';
}
function cleanupOldPhotos(){
  if(!isPhotoOnDayPanel()) return;
  const today=dk();
  const altPrefix='kaigo_photos_';
  const toRemove=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(!key||!key.startsWith(altPrefix)) continue;
    const match=key.match(/_(\d{4}-\d{2}-\d{2})$/);
    if(!match) continue;
    if(match[1]<today) toRemove.push(key);
  }
  toRemove.forEach(function(k){
    try{ localStorage.removeItem(k); }catch(e){}
  });
  if(toRemove.length>0) console.log('[Photo Cleanup] Removed '+toRemove.length+' old photos');
}

  if(!isPhotoOnDayPanel()) return;

  const isImage=

/** テキストエリア先頭の「登録チップ行」と残りの自由記入を分離 */
function parseDayTextarea(dayText, dayItems){
  const set=new Set((dayItems||[]).map(x=>String(x)));
  const lines=String(dayText||'').split(/\r?\n/);
  const chips=[];
  let i=0;
  for(;i<lines.length;i++){
    const L=lines[i];
    if(set.has(L)){ chips.push(L); continue; }
    if(L==='' && chips.length){ i++; break; }
    break;
  }
  const free=lines.slice(i).join('\n').replace(/^\n+/,'').trim();
  return {chips,free};
}
function composeDayTextarea(sel, free){
  const f=String(free||'').trim();
  const arr=Array.isArray(sel)?sel:[];
  if(!arr.length) return f;
  const body=arr.join('\n');
  return f?(body+'\n\n'+f):body;
}

  (rec.vital||[]).forEach(v=>{
    const parts=[];
    const tv=normalizeTempValue(v.temp);
    if(tv!==''&&tv!=null) parts.push('体温:'+tv+'℃');
    if((v.sbp&&String(v.sbp).trim())||(v.dbp&&String(v.dbp).trim())) parts.push('血圧:'+(v.sbp||'')+'/'+(v.dbp||''));
    if(v.pulse&&String(v.pulse).trim()) parts.push('脈拍:'+v.pulse);
    if(v.spo2&&String(v.spo2).trim()&&v.spo2!=='—') parts.push('SpO2:'+v.spo2+'%');
    if(v.weight&&String(v.weight).trim()) parts.push('体重:'+v.weight+'kg');
    push(v.time,'バイタル',parts.join('、'),v.staff||'');
  });
  (rec.excretion||[]).forEach(e=>{
    const parts=[];
    if(e.urine&&e.urine!=='なし') parts.push('排尿:'+e.urine);
    else if(e.urine==='なし') parts.push('排尿:なし');
    if(e.pad&&e.pad!=='なし') parts.push('パット:'+e.pad);
    if(e.stool&&e.stool!=='なし') parts.push('排便:'+e.stool);
    else if(e.stool==='なし') parts.push('排便:なし');
    const flags=[];
    if(e.padChange) flags.push('パット交換');
    if(e.rehaChange) flags.push('リハパン交換');
    if(e.diaperChange) flags.push('おむつ交換');
    if(flags.length) parts.push(flags.join('・'));
    push(e.time,'排泄',parts.join('、'),e.writer||e.staff||'');
  });
  (rec.bath||[]).forEach(b=>push(b.time,'入浴',b.type||'',b.staff||''));
  (rec.care||[]).forEach(c=>push(c.time,'ケア記録',getCareContentText(c),c.staff||''));
  (rec.notes||[]).filter(n=>!n._deleted).forEach(n=>push(n.time||'','申送り',n.content||'',n.writer||''));
  const recBody=getRecSummaryText(rec.rec);
  if(recBody){
    push(rec.rec.time||'15:00','レク',recBody,rec.rec.staff||'');
  }
  if(!opts.excludeDayRow&&String(rec.day||'').trim()){
    push('', '1日の様子', String(rec.day||'').trim(), rec.dayWriter||'');
  }
  const m=rec.meal||{};
  if(shouldShowMealSection(m,'breakfast',name)&&mealSectionExplicitlyRecorded(m,'breakfast')){
    const parts=[];
    if(m.bMain!=null&&String(m.bMain).trim()!=='') parts.push('主食:'+m.bMain+'%');
    if(m.bSide!=null&&String(m.bSide).trim()!=='') parts.push('副食:'+m.bSide+'%');
    if(String(m.bWater||'').trim()) parts.push('水分:'+m.bWater+'ml');
    if(parts.length) push(m.bTime||'07:30','朝食',parts.join('、'),'');
  }
  if(shouldShowMealSection(m,'lunch',name)&&mealSectionExplicitlyRecorded(m,'lunch')){
    const parts=[];
    if(m.main!=null&&String(m.main).trim()!=='') parts.push('主食:'+m.main+'%');
    if(m.side!=null&&String(m.side).trim()!=='') parts.push('副食:'+m.side+'%');
    if(String(m.water||'').trim()) parts.push('水分:'+m.water+'ml');
    if(String(normalizeMealFreeText(m.menu)||'').trim()) parts.push('メニュー:'+normalizeMealFreeText(m.menu));
    const snackTxt=String(normalizeMealFreeText(m.snack)||'').trim();
    if(snackTxt) parts.push('おやつ:'+snackTxt);
    if(parts.length) push(m.time||'11:50','昼食',parts.join('、'),'');
  }
  if(shouldShowMealSection(m,'dinner',name)&&mealSectionExplicitlyRecorded(m,'dinner')){
    const parts=[];
    if(m.dMain!=null&&String(m.dMain).trim()!=='') parts.push('主食:'+m.dMain+'%');
    if(m.dSide!=null&&String(m.dSide).trim()!=='') parts.push('副食:'+m.dSide+'%');
    if(String(m.dWater||'').trim()) parts.push('水分:'+m.dWater+'ml');
    if(parts.length) push(m.dTime||'17:30','夕食',parts.join('、'),'');
  }
  MED_TIMINGS.forEach(t=>{
    const md=(rec.med&&rec.med[t.id])||{};
    const items=(md.items||[]).filter(Boolean);
    if(!items.length && !String(md.time||'').trim() && !String(md.staff||'').trim()) return;
    push(md.time||'', '服薬', `${t.label}：${items.join('、')||'（内容未入力）'}`, md.staff||'');
  });
  const catOrder={'バイタル':1,'排泄':2,'入浴':3,'朝食':4,'昼食':5,'夕食':6,'服薬':7,'ケア記録':8,'申送り':9,'レク':10,'1日の様子':11};
  rows.sort((a,b)=>{
    const at=a.t||'99:99', bt=b.t||'99:99';
    if(at!==bt) return at<bt?-1:1;
    return (catOrder[a.cat]||99)-(catOrder[b.cat]||99);
  });
  return rows;
}
