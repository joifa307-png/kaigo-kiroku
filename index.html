<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="介護記録">
<meta http-equiv="Cache-Control" content="max-age=0, must-revalidate">
<title id="pageTitle">介護記録</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
<style>
/* ===== CSS変数 ===== */
:root{
  --blue:#185FA5; --blue2:#E6F1FB;
  --orange:#E87722; --orange2:#C45F0A; --orange-bg:#FEF0E6;
  --green:#0F6E56; --green2:#E1F5EE; --green-bg:#E1F5EE;
  --red:#A32D2D; --red2:#FCEBEB;
  --text1:#1A1916; --text2:#5C5A54; --text3:#9E9C94;
  --border1:#DDDBD4; --border2:#C8C5BC;
  --bg:#F5F4F0; --white:#fff;
  /* 詳細画面：パネル白との差をやや強める（背景を約1段階濃く） */
  --detail-screen-bg:#E4DFD4; --detail-screen-bg2:#D8D2C6;
  --r1:7px; --r2:10px; --r3:16px;
  --shadow:0 2px 8px rgba(0,0,0,.10);
}

/* ===== リセット ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--text1);font-size:30px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:30px;}

/* ===== ヘッダー共通 ===== */
.hdr{
  background:linear-gradient(135deg,#fff 0%,#FEF6F0 100%);
  border-bottom:1px solid var(--border1);
  padding:4px 10px;display:flex;align-items:center;gap:6px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow);
  /* iPad 狭幅で右端の🔄等が画面外に出たり、下の表にタッチが奪われるのを防ぐ */
  overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;
}
/* メイン画面ヘッダー：折り返し・横スクロールなし（1行に収める） */
#mainScreen.screen.active > .hdr.hdr-main{
  overflow-x:hidden;
  flex-wrap:nowrap;
  gap:4px;
  padding:4px 6px;
  align-items:center;
}
#mainScreen.screen.active > .hdr.hdr-main .hdr-logo{height:52px;}
#mainScreen.screen.active > .hdr.hdr-main .hdr-app-ver{font-size:11px;max-width:110px;}
#mainScreen.screen.active > .hdr.hdr-main .hdr-btn{padding:6px 8px;font-size:13px;}
#mainScreen.screen.active > .hdr.hdr-main .hdr-btn.nav{padding:5px 8px;font-size:16px;}
#mainScreen.screen.active > .hdr.hdr-main .hdr-date{font-size:15px;padding:5px 8px;}
#mainScreen.screen.active > .hdr.hdr-main .sync-indicator{font-size:11px;gap:3px;max-width:none;}
.hdr-logo{height:60px;width:auto;display:block;}
.hdr-app-ver{font-size:12px;line-height:1.25;color:var(--text3);padding:0 2px;white-space:nowrap;max-width:160px;}
.hdr-title{font-weight:700;font-size:16px;color:var(--orange2);}
.hdr-facility{font-size:12px;color:var(--text3);margin-left:4px;}
.hdr-btn{
  padding:7px 12px;border-radius:var(--r2);border:1px solid var(--border2);
  background:var(--white);color:var(--text2);font-size:14px;
  cursor:pointer;white-space:nowrap;user-select:none;
  flex-shrink:0;
}
.hdr-btn:active{opacity:.7;}
.hdr-btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);}
.hdr-btn.nav{padding:6px 10px;font-size:18px;}
.hdr-center{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.hdr-date{
  font-size:17px;font-weight:600;padding:6px 10px;
  border-radius:var(--r2);border:1px solid var(--border2);
  background:var(--white);cursor:pointer;white-space:nowrap;
}
.sync-indicator{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);flex-shrink:0;max-width:42vw;}
.sync-dot{font-size:16px;line-height:1;}

/* ===== 画面切替 ===== */
.screen{display:none;}
.screen.active{display:block;}

/* ===== メイン画面（表示中のみ flex。ID 単体の display は .screen 非表示を壊すため禁止） ===== */
#mainScreen.screen.active{
  display:flex;flex-direction:column;
  height:100vh;max-height:100vh;
  height:100dvh;max-height:100dvh;
  min-height:0;overflow:hidden;
}
#mainScreen.screen.active .main-scroll{
  flex:1;min-height:0;
  overflow:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  /* pan-x pan-y だけだと環境によってタップ→click が合成されないことがある */
  touch-action:manipulation;
}
/* collapse は sticky と相性が悪く、ヘッダーが tbody のタップを奪うことがある → separate */
.res-table{width:100%;border-collapse:separate;border-spacing:0;min-width:700px;}
#mainScreen .res-table thead th.main-th-click{
  cursor:pointer;
}
/* 見出しのみ：予定・実績2列を1枠（縦横とも黒線） */
#mainScreen .res-table thead th.main-yotei-jisseki-head{
  border:1px solid #000 !important;
  letter-spacing:.02em;
}
#mainScreen .res-table thead th{
  position:sticky;top:0;z-index:30;
  background:var(--orange);color:#fff;padding:8px 6px;
  font-size:22px;white-space:nowrap;text-align:center;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
  border-bottom:2px solid #c55a0f;
  border-right:1px solid rgba(255,255,255,.35);
}
#mainScreen .res-table thead th:last-child{
  border-right:none;
}
/* メイン表：列ジャンプの目印（幅は他列と同じ1px・色だけやや濃く） */
#mainScreen .res-table thead th.res-div-l{
  border-left:1px solid rgba(0,0,0,.18);
}
#mainScreen .res-table thead th.res-div-r{
  border-right:1px solid rgba(0,0,0,.18);
}
#mainScreen .res-table thead th.res-div-lr{
  border-left:1px solid rgba(0,0,0,.18);
  border-right:1px solid rgba(0,0,0,.18);
}
.res-table td{
  padding:10px 6px;border-bottom:1px solid var(--border1);
  border-right:1px solid var(--border1);
  text-align:center;font-size:14px;vertical-align:middle;cursor:pointer;
}
.res-table td:last-child{border-right:none;}
.res-table td.res-div-l{
  border-left:1px solid #cac8c0;
  border-left-color:color-mix(in srgb,var(--border1) 85%,var(--text1) 15%);
}
.res-table td.res-div-r{
  border-right:1px solid #cac8c0;
  border-right-color:color-mix(in srgb,var(--border1) 85%,var(--text1) 15%);
}
.res-table td.res-div-lr{
  border-left:1px solid #cac8c0;
  border-left-color:color-mix(in srgb,var(--border1) 85%,var(--text1) 15%);
  border-right:1px solid #cac8c0;
  border-right-color:color-mix(in srgb,var(--border1) 85%,var(--text1) 15%);
}
.res-table tbody tr:nth-child(odd) td{background:var(--white);}
.res-table tbody tr:nth-child(even) td{background:#F7F6F2;}
.res-table tbody tr:active td{background:var(--blue2)!important;}
.name-cell{text-align:left !important;padding-left:6px !important;padding-right:4px !important;cursor:default;}
.name-cell-inner{display:flex;align-items:center;gap:4px;}
.name-cell-text{flex:1;}
.name-txt{font-size:22px;font-weight:500;}
.name-sub{font-size:16px;color:var(--text3);}
.res-del-btn{border:none;background:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1;flex-shrink:0;}
.res-del-btn:active{color:var(--red);}
.res-add-row td{background:var(--white)!important;text-align:center;padding:6px!important;}
.res-add-btn{border:1px dashed var(--border2);background:none;color:var(--text2);font-size:16px;padding:6px 20px;border-radius:var(--r2);cursor:pointer;}
/* オーバーレイ中央配置（卸記録など） */
.ov-back.ov-center.show{display:flex;align-items:center;justify-content:center;}
.ov-back.ov-center .ov{position:relative;bottom:auto;left:auto;right:auto;transform:none;border-radius:var(--r3);}
/* 卸記録 */
.sup-tab-btn{padding:8px 18px;border:1px solid var(--border2);border-radius:var(--r2);background:var(--white);color:var(--text2);font-size:17px;cursor:pointer;}
.sup-tab-btn.active{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700;}
.sup-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border1);font-size:19px;}
.sup-item-info{flex:1;line-height:1.5;}
.sup-item-date{font-size:15px;color:var(--text3);}
.sup-sum-table{width:100%;border-collapse:collapse;font-size:17px;margin-top:4px;}
.sup-sum-table th{background:var(--orange);color:#fff;padding:10px 8px;text-align:center;font-size:16px;white-space:nowrap;}
.sup-sum-table td{padding:10px 8px;border-bottom:1px solid var(--border1);vertical-align:top;}
.sup-sum-table tr:nth-child(even) td{background:#F7F6F2;}
.sup-sum-name{font-size:18px;font-weight:600;white-space:nowrap;}
.sup-sum-detail{font-size:14px;color:var(--text3);margin-top:2px;}
/* パット等卸記録オーバーレイ：入力を大きく */
#ovSupply{--sup-fs:22px;--sup-label-fs:24px;}
#ovSupply .sup-hdr-title{font-size:22px;font-weight:700;}
#ovSupply .fg label{font-size:var(--sup-label-fs);margin-bottom:6px;}
#ovSupply .fg input,
#ovSupply .fg select{font-size:var(--sup-fs);padding:12px 14px;}
#ovSupply #supQty{font-size:26px!important;font-weight:700;}
#ovSupply .btn-sup-rec{font-size:22px;padding:16px 20px;width:100%;}
#ovSupply .btn-sup-close{font-size:20px;padding:14px 20px;width:100%;margin-top:12px;background:var(--white);color:var(--text2);border:2px solid var(--border2);border-radius:var(--r2);font-weight:600;cursor:pointer;}
#ovSupply .btn-sup-close:active{background:#f0f0ec;}
#ovSupply #supPaneRec,#ovSupply #supPaneSum{padding:18px;}
#ovSupply .sup-form-card{background:#F8F7F4;border-radius:var(--r2);padding:18px;margin-bottom:18px;}
#ovSupply .sup-sum-toolbar label{font-size:18px;font-weight:600;}
#ovSupply .sup-sum-toolbar input[type="month"]{font-size:18px;padding:10px 12px;}
.cell-val{font-size:18px;line-height:1.4;}
.cell-empty{color:var(--text3);font-size:18px;}
.cell-ok{color:var(--green);font-size:22px;font-weight:700;}
.cell-warn{color:var(--red);font-size:18px;font-weight:700;}
.cell-red{color:var(--red);font-size:22px;font-weight:700;}
/* 排泄列専用 */
.cell-ex{font-size:18px;line-height:1.4;}
.badge-ok{color:var(--green);font-weight:700;}
.badge-ng{color:var(--orange2);font-weight:700;}

/* ===== 詳細画面 ===== */
.detail-hdr{
  background:linear-gradient(135deg,#fff 0%,#FEF6F0 100%);
  border-bottom:1px solid var(--border1);
  padding:6px 12px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow);
}
.detail-name{font-size:18px;font-weight:600;color:var(--text1);}
.detail-res-select{
  flex:1;min-width:0;max-width:min(52vw,280px);font-size:17px;font-weight:600;color:var(--text1);
  border:1px solid var(--border2);border-radius:var(--r1);padding:6px 8px;background:var(--white);
}
.back-btn{
  padding:7px 14px;border-radius:var(--r2);border:1px solid #F5C49A;
  background:var(--orange-bg);color:var(--orange2);font-size:15px;font-weight:600;
  white-space:nowrap;flex-shrink:0;cursor:pointer;
}

/* ===== タブ ===== */
.tabs{
  display:flex;overflow-x:auto;background:var(--white);
  border-bottom:2px solid var(--border2);
  position:sticky;top:50px;z-index:99;
  -webkit-overflow-scrolling:touch;
}
.tab{
  padding:10px 16px;font-size:20px;font-weight:600;white-space:nowrap;
  color:var(--text3);border-bottom:3px solid transparent;
  cursor:pointer;flex-shrink:0;margin-bottom:-2px;
}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700;background:var(--orange-bg);}

/* 詳細画面：利用者タブ（記録タブの下） */
.resident-tabs-wrap{
  background:#eeedfe;
  border-bottom:0.5px solid #cecbf6;
}
.resident-tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:8px 12px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.resident-tabs::-webkit-scrollbar{display:none;}
.resident-tab{
  flex:none;
  padding:7px 14px;
  font-size:18px;
  background:#fff;
  border:0.5px solid #cecbf6;
  border-radius:14px;
  color:#3c3489;
  cursor:pointer;
  white-space:nowrap;
}
.resident-tab.active{
  background:#534ab7;
  color:#fff;
  border-color:#534ab7;
  font-weight:500;
}
#detailScreen #detPanel{
  touch-action:pan-y;
  transition:transform 0.2s ease-out,opacity 0.18s ease-out;
}
#detailScreen #detPanel.swiping-left{
  transform:translateX(-30px);
  opacity:0;
}
#detailScreen #detPanel.swiping-right{
  transform:translateX(30px);
  opacity:0;
}

/* ===== 詳細画面の背後（メインより一段コントラストを上げる） ===== */
#detailScreen{
  background:linear-gradient(180deg,var(--detail-screen-bg) 0%,var(--detail-screen-bg2) 100%);
  min-height:100vh;
}
/* 詳細タブ：nishi 旧版相当（appearance 無効化・fg-cols-2/3 で列固定） */
#detailScreen .fg input,
#detailScreen .fg select,
#detailScreen .fg textarea{
  -webkit-appearance:none;
  appearance:none;
}
/* nishi .row2 / .row3 相当の固定列 */
#detailScreen .fg-row.fg-cols-2{
  grid-template-columns:1fr 1fr;
}
#detailScreen .fg-row.fg-cols-3{
  grid-template-columns:1fr 1fr 1fr;
}
#detailScreen .fg-row.fg-cols-2 > .fg,
#detailScreen .fg-row.fg-cols-3 > .fg{
  min-width:0;
}

/* ===== パネル ===== */
.panel{padding:12px;}
.panel-sec{
  background:var(--white);border-radius:var(--r2);padding:14px;
  margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);
}
.panel-sec h3{
  font-size:22px;color:var(--text2);margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border2);
}
.panel-sec h3 .sec-btn{float:right;}

/* ===== フォームグループ ===== */
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:20px;color:var(--text2);margin-bottom:4px;font-weight:600;}
.fg input,.fg select,.fg textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border2);
  border-radius:var(--r1);background:var(--white);font-size:20px;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  outline:none;border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,119,34,.15);
}
.fg textarea{min-height:100px;resize:vertical;}
.fg-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;}
.fg-row .fg{min-width:0;}
/* フォーム行は v2 旧版と同じ（repeat(auto-fit,minmax(0,1fr))） */
.fg-hint{font-size:14px;color:var(--text3);margin-top:3px;}
.ex-stool-compact label{margin-bottom:2px;}
.ex-stool-compact select{font-size:20px!important;padding:6px 10px!important;line-height:1.2;}

/* ===== チップ ===== */
.chip{
  display:inline-block;padding:8px 18px;border-radius:20px;
  border:1px solid var(--border2);background:var(--white);
  font-size:20px;cursor:pointer;user-select:none;margin:3px;
}
.chip.on,.chip.pc-on{background:var(--orange);color:#fff;border-color:var(--orange);}
.chip.selected{background:var(--orange);color:#fff;border-color:var(--orange);}
/* 1日の様子：長文チップは折り返し・横幅いっぱいで読みやすく */
#dayChips .chip{
  flex:1 1 100%;max-width:100%;white-space:normal;text-align:left;
  font-size:16px;line-height:1.35;padding:8px 12px;border-radius:12px;
}

/* ===== ボタン ===== */
.btn{
  display:inline-block;padding:10px 20px;border-radius:var(--r2);
  border:none;font-size:20px;font-weight:600;cursor:pointer;
  user-select:none;text-align:center;
}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:active{opacity:.8;}
.btn-danger{background:var(--red);color:#fff;}
.btn-gray{background:var(--border2);color:var(--text2);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:active{opacity:.8;}
.btn-sm{padding:6px 12px;font-size:18px;}
.btn-block{display:block;width:100%;}

/* ===== 履歴リスト ===== */
.hist-list{margin-bottom:14px;}
.hist-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border2);
}
.hist-item:last-child{border-bottom:none;}
.hist-time{color:var(--orange2);font-weight:700;white-space:nowrap;min-width:80px;font-size:20px;}
.hist-content{flex:1;color:var(--text1);font-size:20px;line-height:1.5;}
.hist-del{color:var(--red);font-size:18px;padding:4px 10px;border:1px solid var(--red);
  border-radius:var(--r1);background:none;cursor:pointer;white-space:nowrap;}
.hist-edit{color:var(--blue);font-size:18px;padding:4px 10px;border:1px solid var(--blue);
  border-radius:var(--r1);background:none;cursor:pointer;white-space:nowrap;margin-right:2px;}
.lw-sent-badge{
  display:inline-block;margin-left:4px;
  color:#06C755;font-weight:700;font-size:16px;
  vertical-align:middle;
}
.hist-day{font-size:14px;color:var(--orange2);font-weight:600;margin:6px 0 2px;}

/* ===== オーバーレイ ===== */
.ov-back{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
}
.ov-back.show{display:block;}
.ov{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-radius:var(--r3) var(--r3) 0 0;
  max-height:90vh;overflow-y:auto;z-index:201;padding:20px 16px;
  transform:translateY(100%);transition:transform .25s ease;
}
.ov-back.show .ov,.ov-back.show+.ov{transform:translateY(0);}
.ov.show{transform:translateY(0);}
.ov-title{
  font-size:17px;font-weight:700;margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid var(--border2);
  display:flex;justify-content:space-between;align-items:center;
}
.ov-close{font-size:20px;color:var(--text3);border:none;background:none;cursor:pointer;padding:0 4px;}

/* ===== カレンダー ===== */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px;
}
.cal-lbl{text-align:center;font-size:10px;color:var(--text3);padding:3px 0;font-weight:600;}
.cal-day{
  text-align:center;padding:5px 2px;font-size:12px;border-radius:var(--r1);
  cursor:pointer;position:relative;
}
.cal-day:active{background:var(--blue2);}
.cal-day.today{background:var(--orange2);color:#fff;font-weight:700;}
.cal-day.sel{background:var(--orange);color:#fff;font-weight:700;}
.cal-day.has::after{
  content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;background:var(--green);
}
.cal-day.today.has::after,.cal-day.sel.has::after{background:#fff;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;}
.cal-nav-title{font-weight:700;font-size:13px;}

/* ===== 服薬チップ ===== */
.med-chip{
  display:inline-block;padding:8px 20px;border-radius:20px;
  border:1px solid var(--border2);background:var(--white);
  font-size:26px;cursor:pointer;margin:3px;user-select:none;
}
.med-chip.on{background:var(--orange);color:#fff;border-color:var(--orange);}
.med-chip.none-on{background:var(--text3);color:#fff;border-color:var(--text3);}

/* ===== 設定画面 ===== */
.settings-tabs{
  display:flex;overflow-x:auto;background:var(--white);
  border-bottom:1px solid var(--border2);
  -webkit-overflow-scrolling:touch;
}
.settings-tab{
  padding:10px 16px;font-size:13px;white-space:nowrap;
  color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;
  flex-shrink:0;
}
.settings-tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700;}
.settings-panel{display:none;padding:14px;}
.settings-panel.active{display:block;}
.settings-list-item{
  display:flex;align-items:center;gap:8px;padding:10px;
  border:1px solid var(--border2);border-radius:var(--r1);margin-bottom:8px;
  background:var(--white);
}
.settings-list-item .item-name{flex:1;font-size:14px;}
.settings-list-item .settings-list-actions{display:flex;gap:4px;flex-shrink:0;align-items:center;}
.settings-list-item .item-move{
  font-size:12px;padding:3px 8px;border:1px solid var(--border2);border-radius:var(--r1);
  background:var(--white);cursor:pointer;color:var(--text2);min-width:34px;
}
.settings-list-item .item-move:disabled{opacity:.45;cursor:not-allowed;}
.settings-list-item .item-del{
  color:var(--red);font-size:12px;padding:3px 8px;
  border:1px solid var(--red);border-radius:var(--r1);background:none;cursor:pointer;
}
.res-info-inp,.res-info-sel{
  font-size:14px;
  padding:6px 8px;
  line-height:1.2;
}
.res-info-sel{padding:6px 6px;}
.bill-inp,.bill-sel{
  font-size:14px;
  padding:6px 8px;
  line-height:1.2;
}
.bill-sel{padding:6px 6px;}
.bill-addon{
  width:16px;
  height:16px;
  vertical-align:middle;
}
.sc-inp{
  font-size:14px;
  padding:6px 8px;
  line-height:1.2;
}
/* 設定・利用者管理：枠リストではなく左寄せ表 */
.resident-mgmt-table-wrap{width:100%;overflow-x:auto;margin:6px 0 14px;text-align:left;}
.resident-mgmt-table{
  border-collapse:collapse;margin:0;
  font-size:16px;background:var(--white);
}
.resident-mgmt-table th,.resident-mgmt-table td{
  border:1px solid var(--border2);
  padding:7px 10px;
  vertical-align:middle;
}
.resident-mgmt-table thead th{
  background:#F0EFE9;font-size:13px;font-weight:600;color:var(--text2);
}
.resident-mgmt-th-name,.resident-mgmt-td-name{
  text-align:left;
  max-width:22em;
  overflow-wrap:anywhere;
}
.resident-mgmt-td-name{font-weight:500;line-height:1.35;}
.resident-mgmt-th-in,.resident-mgmt-td-in{
  text-align:center;
  width:5.75rem;
  white-space:nowrap;
}
.resident-mgmt-th-del,.resident-mgmt-td-del{
  text-align:center;
  width:3.25rem;
  padding-left:6px;padding-right:6px;
}
.resident-mgmt-th-del{font-size:12px;font-weight:600;}
.resident-mgmt-td-in label{
  display:inline-flex;align-items:center;gap:5px;margin:0;
  cursor:pointer;font-size:14px;color:var(--text2);white-space:nowrap;
}
.resident-mgmt-td-del .res-del-btn{padding:4px;margin:0 auto;}

/* ===== 印刷 ===== */
#printArea{display:none;}
@media print{
  .no-print{display:none !important;}
  .screen{display:none !important;}
  #printArea{display:block !important;}
  body{background:#fff;font-size:11px;}
  .print-title{font-size:14px;font-weight:700;margin-bottom:8px;border-bottom:2px solid #333;padding-bottom:4px;}
  .print-table{border-collapse:collapse;width:100%;margin-bottom:12px;}
  .print-table th{background:#f0f0f0;border:1px solid #555;padding:4px 6px;font-size:11px;white-space:nowrap;}
  .print-table td{border:1px solid #999;padding:3px 6px;font-size:11px;vertical-align:top;}
  /* バイタル期間印刷：日付・氏名列を等分比約30%広げる（9列等分≈11.1%→約14.4%） */
  .print-table-vital{table-layout:fixed;}
  .print-table-vital col.col-vital-date{width:14.4%;}
  .print-table-vital col.col-vital-name{width:14.4%;}
  .print-table-vital td:nth-child(1),.print-table-vital th:nth-child(1){white-space:nowrap;}
  .print-subtitle{font-size:12px;font-weight:600;margin:10px 0 4px;color:#333;}
}

/* ===== ユーティリティ ===== */
.text-blue{color:var(--blue);}
.text-green{color:var(--green);}
.text-orange{color:var(--orange2);}
.text-red{color:var(--red);}
.text-gray{color:var(--text3);}
.mt8{margin-top:8px;}
.mt12{margin-top:12px;}
.flex{display:flex;}
.flex-1{flex:1;}
.gap8{gap:8px;}
.gap6{gap:6px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.w100{width:100%;}
.day-photo-thumb{
  position:relative;
  width:80px;
  height:80px;
  border:1px solid #ccc;
  border-radius:6px;
  overflow:hidden;
  background:#f5f5f0;
}
.day-photo-thumb img{

  object-fit:cover;
  display:block;
}
.day-photo-del{
  position:absolute;

  right:2px;

  border-radius:50%;

  line-height:1;
  cursor:pointer;
  padding:0;
}
.print-photo-thumb{
  position:relative;
  width:60px;
  height:60px;
  border:1px solid #ccc;
  border-radius:4px;
  overflow:hidden;
}
.print-photo-thumb img{
  width:100%;

  display:block;
}
.print-photo-del{

  right:1px;

  border-radius:50%;

  line-height:1;
  cursor:pointer;
  padding:0;
}
</style>
</head>
<body>

<!-- ========== 施設選択画面 ========== -->
<div id="selectScreen" class="screen active">

      <button type="button" onclick="selectFacility('minami')" style="padding:24px;border-radius:var(--r3);border:2px solid var(--blue);background:var(--blue2);color:var(--blue);font-size:22px;font-weight:700;cursor:pointer;">

      <button class="hdr-btn nav" onclick="moveDay(1)">▶</button>

    <button class="hdr-btn no-print" onclick="openScheduleScreen()" style="background:#F3F3F3;color:#3a3a3a;border-color:#9E9C94;font-weight:700;">📊実績CSV</button>

    <button class="hdr-btn no-print" onclick="openSettings()">⚙️</button>
  </div>
  <div class="main-scroll">
    <table class="res-table" id="resTable">
      <thead>
        <tr>
          <th colspan="2" class="main-th-click main-yotei-jisseki-head" style="min-width:72px;white-space:nowrap;text-align:center;" title="タップで算定確定">予定実績</th>

          <th class="res-div-l">体温</th>
          <th>血圧</th>
          <th>脈拍</th>
          <th class="res-div-r">SpO2</th>
          <th>排泄</th>
          <th class="res-div-r" style="white-space:nowrap;">最終排便</th>
          <th class="res-div-r">入浴</th>
          <th class="res-div-r">食事</th>
          <th class="res-div-r">レク</th>

      <tbody id="resBody"></tbody>

<!-- ========== 詳細画面 ========== -->
<div id="detailScreen" class="screen">

  </div>

<!-- ========== 予定実績画面 ========== -->
<div id="scheduleScreen" class="screen">

    <button class="back-btn" onclick="closeScheduleScreen()">◀ メイン</button>

<!-- ========== 設定画面 ========== -->

      <button class="ov-close" onclick="closeOv('ovSched')">✕</button>

  </div>
</div>

<!-- ========== 月間予定表取込オーバーレイ ========== -->
<div class="ov-back" id="ovUpload" onclick="if(event.target===this)closeOv('ovUpload')">
  <div class="ov show" style="padding:20px;max-width:480px;width:92vw;">
    <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border2);margin-bottom:16px;">
      <span style="font-size:20px;font-weight:700;">📅 月間予定表を読み込む</span>
      <button onclick="closeOv('ovUpload')" style="margin-left:auto;border:none;background:none;font-size:26px;cursor:pointer;color:var(--text3);">×</button>
    </div>
    <div style="border:2px dashed var(--border2);border-radius:var(--r2);padding:28px 16px;text-align:center;cursor:pointer;color:var(--text3);background:#fafafa;" onclick="document.getElementById('xlsxFile').click()">

      <div style="font-size:17px;font-weight:600;color:var(--text2);">タップしてExcelを選択</div>

    </div>

    <div id="uploadMsg" style="margin-top:14px;font-size:15px;color:var(--text2);min-height:40px;"></div>
    <p style="font-size:12px;color:var(--text3);margin-top:10px;">
      ⚠ 読み込むと今月の利用者予定が上書きされ、全端末に同期されます
    </p>
  </div>
</div>

<!-- ========== パット等卸記録オーバーレイ ========== -->

    </div>
  </div>
</div>

<!-- ========== 利用者追加オーバーレイ ========== -->
<div class="ov-back" id="ovAddRes" onclick="if(event.target===this)closeOv('ovAddRes')">
  <div class="ov show" style="padding:20px;max-width:400px;width:92vw;">
    <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border2);margin-bottom:16px;">

    <div style="margin:16px 0 10px;display:flex;align-items:center;gap:8px;">
      <div style="flex:1;border-top:1px solid var(--border2);"></div>
      <span style="font-size:14px;color:var(--text3);">または新規作成</span>
      <div style="flex:1;border-top:1px solid var(--border2);"></div>
    </div>
    <div class="fg"><label>氏名</label><input type="text" id="addResName" placeholder="山田 花子" style="font-size:18px;"></div>
    <div class="fg"><label>介護度</label>
      <select id="addResCare" style="font-size:18px;">
        <option>要支援１</option><option>要支援２</option>
        <option>要介護１</option><option>要介護２</option><option>要介護３</option>
        <option>要介護４</option><option selected>要介護５</option>

const FACILITY_DEFAULT_TIMES = {
  nishi:  { startTime: '0900', endTime: '1630' },
  minami: { startTime: '0900', endTime: '1605' },
};
function facilityDefaultStartTime(facId){
  const id=normalizeFacilityId(facId||(FACILITY_ID||''))||'nishi';
  return (FACILITY_DEFAULT_TIMES[id]||FACILITY_DEFAULT_TIMES.nishi).startTime;
}
function facilityDefaultEndTime(facId){
  const id=normalizeFacilityId(facId||(FACILITY_ID||''))||'nishi';
  return (FACILITY_DEFAULT_TIMES[id]||FACILITY_DEFAULT_TIMES.nishi).endTime;
}
function isMinamiFacility(){
  return FACILITY_ID==='minami'||(FAC&&FAC.storageKey==='kaigo_minami');
}

/** URL・localStorage・Cookie の施設ID（大文字小文字・前後空白のゆれ対策） */
function normalizeFacilityId(raw){
  const s=String(raw==null?'':raw).trim().toLowerCase();
  return FACILITIES[s]?s:'';
}

// 施設情報（動的に設定）
let FACILITY_ID = null;
let FAC = null;

function initFacility(facId){
  const id=normalizeFacilityId(facId);
  if(!id) return false;
  FACILITY_ID = id;
  FAC = FACILITIES[id];
  cleanupOldPhotos();
  return true;
}

/** ブックマークと実際のユニットのずれ防止（西／南は別データのため） */
function syncFacilityIntoUrl(facId){
  const id=normalizeFacilityId(facId);
  if(!id) return;
  try{
    const u=new URL(window.location.href);
    if(u.searchParams.get('f')===id) return;
    u.searchParams.set('f', id);
    history.replaceState(history.state,'',u.pathname+u.search+(u.hash||''));
  }catch(_){}
}

function selectFacility(facId){
  const id=normalizeFacilityId(facId);
  if(!id){ alert('施設IDが不正です（西・南のいずれかを選んでください）'); return; }
  try{
    localStorage.setItem('kaigo_last_facility', id);
    gasMirrorToCookies();
    if(initFacility(id)){
      syncFacilityIntoUrl(id);
      startApp();
    }
  }catch(err){
    console.error('selectFacility',err);
    FAC=null; FACILITY_ID=null;
    alert('施設の開始に失敗しました: '+(err&&err.message||String(err)));
    showScreen('selectScreen');
  }
}

function startApp(){
  showScreen('mainScreen');
  /** メインスレッドで loadDB が長いとタップが効かないように見えるため、描画後に続きを実行 */
  requestAnimationFrame(()=>{

        startScheduledSync();

}

function loadDB(){
  if(!FAC){ showScreen('selectScreen'); return; }

  }catch(e){ console.error('loadDB error',e); }
  // syncDirtyをlocalStorageから復元（ページ再読み込み後も未送信フラグを保持）
  if(localStorage.getItem(FAC.storageKey+'_dirty')==='1') syncDirty = true;
  // 初期値補完（DEFAULT_RESIDENTS_NIHSIは使わない：クラウド同期で復元するため）
  if(!db.residents) db.residents = [];
  if(!db.records) db.records={};
  db.records=normalizeRecordsMap(db.records||{});
  normalizeVitalTempsInRecords(db.records);
  coalesceAllRecordArrays(db.records);
  if(!db.supplies) db.supplies=[];
  if(!db.settings) db.settings={};
  restoreSettingsSnapshotIfNeeded();
  // settingsのデフォルト補完（未定義 or 空配列の場合にデフォルトを適用）
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{
    const cur = db.settings[k];
    const def = DEFAULT_SETTINGS[k];
    if(cur === undefined || cur === null){
      db.settings[k] = JSON.parse(JSON.stringify(def));
    } else if(Array.isArray(def) && def.length > 0 && Array.isArray(cur) && cur.length === 0){
      // 配列項目が空の場合もデフォルトで補完（staffList・supplyProductsは除外）
      if(!['staffList','supplyProducts'].includes(k)){
        db.settings[k] = JSON.parse(JSON.stringify(def));
      }
    }
  });
  let needSaveAfterMigrate=false;
  if(!db.settings.residentTypes||typeof db.settings.residentTypes!=='object'||Array.isArray(db.settings.residentTypes))
    db.settings.residentTypes={};
  try{
    const lk=FAC.storageKey+'_resident_types';
    let migRaw=localStorage.getItem(lk);
    if(!migRaw) migRaw=localStorage.getItem('kaigo_resident_types');
    if(migRaw&&Object.keys(db.settings.residentTypes).length===0){
      const parsed=JSON.parse(migRaw);
      if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){
        db.settings.residentTypes=parsed;
        touchSetU('residentTypes');
        needSaveAfterMigrate=true;
      }
    }
  }catch(_){}
  try{
    const cur=String(db.settings.logoB64||'').trim();
    if(cur.length<=20){
      const side=(localStorage.getItem(FAC.storageKey+'_logo_b64_v1')||'').trim();
      if(side.length>20){ db.settings.logoB64=side; needSaveAfterMigrate=true; }
    }
  }catch(_){}
  if(JSON.stringify(db.settings.supplyProducts||[])===LEGACY_DEFAULT_SUPPLY_JSON){
    db.settings.supplyProducts=JSON.parse(JSON.stringify(DEFAULT_SETTINGS.supplyProducts));
    touchSetU('supplyProducts');
    needSaveAfterMigrate=true;
  }
  if(JSON.stringify(db.settings.careItems||[])===LEGACY_DEFAULT_CARE_JSON){
    db.settings.careItems=JSON.parse(JSON.stringify(DEFAULT_SETTINGS.careItems));
    touchSetU('careItems');
    needSaveAfterMigrate=true;
  }
  if(JSON.stringify(db.settings.dayItems||[])===LEGACY_DEFAULT_DAY_JSON){
    db.settings.dayItems=JSON.parse(JSON.stringify(DEFAULT_SETTINGS.dayItems));
    touchSetU('dayItems');
    needSaveAfterMigrate=true;
  }
  // v3/v6マイグレーション：サービスコードマスタ（旧版 basic 件数少・deducts 無しを補完）
  if(!db.settings.serviceCodes || !db.settings.serviceCodes.basic ||
     (db.settings.serviceCodes.basic||[]).length < 10){
    db.settings.serviceCodes = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.serviceCodes));
    needSaveAfterMigrate = true;
  }
  if(!Array.isArray(db.settings.serviceCodes.deducts)){
    db.settings.serviceCodes.deducts = JSON.parse(JSON.stringify((DEFAULT_SETTINGS.serviceCodes&&DEFAULT_SETTINGS.serviceCodes.deducts)||[]));
    needSaveAfterMigrate = true;
  }
  if(db.settings.officeNumber === undefined) db.settings.officeNumber = '';
  if(db.settings.serviceTypeCode === undefined) db.settings.serviceTypeCode = '';
  if(!db.settings.prefCode) db.settings.prefCode = '412023';
  if(!Array.isArray(db.settings.officeAddonCodes)) db.settings.officeAddonCodes = [];
  if(db.settings.officeShoguCode === undefined) db.settings.officeShoguCode = '';
  if(db.settings.officeShoguUnit === undefined) db.settings.officeShoguUnit = 0;
  if(!Array.isArray(db.settings.careManagerList)) db.settings.careManagerList = [];
  Object.keys(db.records||{}).forEach(dk=>{
    const day=db.records[dk]||{};
    Object.keys(day).forEach(nm=>{
      const meal=day[nm]&&day[nm].meal;
      if(!meal) return;
      const rawMenu=meal.menu==null?'':String(meal.menu);
      const rawSnack=meal.snack==null?'':String(meal.snack);
      const normMenu=normalizeMealFreeText(meal.menu);
      const normSnack=normalizeMealFreeText(meal.snack);
      if(normMenu!==rawMenu){ meal.menu=normMenu; needSaveAfterMigrate=true; }
      if(normSnack!==rawSnack){ meal.snack=normSnack; needSaveAfterMigrate=true; }
    });
  });
  if(needSaveAfterMigrate) saveDB();
  if(db.settings.facilityName) document.title = db.settings.facilityName;
  // 名前重複を排除（同期バグで汚染された既存データを修復）
  if(db.residents){
    const seen = new Set();
    db.residents = db.residents.filter(r=>{
      const nm=normalizeResidentName(r&&r.name);
      if(!nm||seen.has(nm)) return false;
      r.name=nm;
      seen.add(nm); return true;
    });
    db.residents.forEach(r=>{
      r.serviceType=getResidentClassification(r.name)==='inpatient'?'resident':'day';
    });
  }
  if(!db._setU) db._setU={};
  if(!db.settings._residentDel||typeof db.settings._residentDel!=='object'||Array.isArray(db.settings._residentDel))
    db.settings._residentDel={};
  if(!db.settings._residentRevive||typeof db.settings._residentRevive!=='object'||Array.isArray(db.settings._residentRevive))
    db.settings._residentRevive={};
  if(!db.settings._recordItemDel||typeof db.settings._recordItemDel!=='object'||Array.isArray(db.settings._recordItemDel))
    db.settings._recordItemDel={};
  initializeSetUForExistingSettings();
  syncLogoMirror();
  saveSettingsSnapshot();
}

function _ymdLocal(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
/** 卸記録・集計用：YYYY-MM-DD はタイムゾーンずれ防止のためそのまま。日時文字列はローカル暦で YYYY-MM-DD に正規化 */
function supplyDateCalendarKey(raw){
  if(raw==null||raw==='') return '';
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(isNaN(d.getTime())) return '';
  return _ymdLocal(d);
}
/** GAS の resetAt（ISO 等）から比較用の暦日キー YYYY-MM-DD（ローカル） */
function resetCalendarKeyFromResetAt(resetStr){
  const s=String(resetStr||'').trim();
  if(!s) return '';
  const ms=Date.parse(s);
  if(!isNaN(ms)) return _ymdLocal(new Date(ms));
  return supplyDateCalendarKey(s);
}
/**
 * fromDateStr が空：今月（ローカル）の記録のみ集計。
 * それ以外：resetAt 暦日以降の記録のみ（YYYY-MM-DD 文字列比較）。
 */
function _sumSuppliesFromDate(fromDateStr, productNames, sourceStorageKey){
  const out={};
  (productNames||[]).forEach(p=>{ out[p]=0; });
  const src=String(sourceStorageKey||'kaigo_nishi').trim()||'kaigo_nishi';
  let raw='';
  try{ raw=localStorage.getItem(src)||''; }catch(_){ raw=''; }
  if(!raw) return out;
  let j=null;
  try{ j=JSON.parse(raw); }catch(_){ j=null; }
  if(!j||typeof j!=='object') return out;
  const list=Array.isArray(j.supplies)?j.supplies:[];
  const now=new Date();
  const monthYm=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const fromTrim=String(fromDateStr||'').trim();
  const resetDayKey=fromTrim?resetCalendarKeyFromResetAt(fromTrim):'';
  list.forEach(s=>{
    if(!s) return;
    const ymd=supplyDateCalendarKey(s.date);
    if(!ymd) return;
    if(resetDayKey){
      if(ymd<resetDayKey) return;
    }else{
      if(!ymd.startsWith(monthYm)) return;
    }
    const p=String(s.product==null?'':s.product);
    if(!(p in out)) return;
    const q=Number(s.qty);
    out[p]+=Number.isFinite(q)?q:0;
  });
  return out;
}
function zaikoGasUrlWithTokenQuery(){
  const base=String(zaikoGasUrl()||'').trim();
  const tok=zaikoGasToken();
  try{
    const u=new URL(base);
    u.searchParams.set('token', tok);
    return u.toString();
  }catch(_){
    const sep=base.includes('?')?'&':'?';
    return base+sep+'token='+encodeURIComponent(tok);
  }
}
function zaikoExtractResetAtFromGetJson(data){
  if(!data||typeof data!=='object') return '';
  const nested=data.data&&typeof data.data==='object'&&data.data.resetAt!=null?data.data.resetAt:data.resetAt;
  return nested==null?'':String(nested).trim();
}
/** resetAt 反映後の消費マップを GAS へ POST（集計結果送信・自動送信共通） */
function postZaikoConsumed(consumed, opts){
  const url=zaikoGasUrl();
  if(!url) return Promise.resolve(false);
  opts=opts||{};
  const sender=String(opts.sender||'kaigo_nishi_auto')||'kaigo_nishi_auto';
  const field=String(opts.field||'nishiConsumedSync')||'nishiConsumedSync';
  const treatFetchErrorAsSuccess=!!opts.treatFetchErrorAsSuccess;
  const supply={};
  Object.keys(consumed||{}).forEach(p=>{
    supply[p]={};
    supply[p][field]=Number(consumed[p]||0);
  });
  const payload={
    token:zaikoGasToken(),
    sender,
    sentAt:new Date().toISOString(),
    settings:{},
    supply,
    daily:{}
  };
  let _zaikoStatus=null;
  return fetch(url,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(payload)
  }).then(function(r){
    _zaikoStatus=r.status;
    console.log('zaiko POST status:', r.status);
    return r.text();
  }).then(function(t){
    console.log('zaiko POST response:', t);
    return (_zaikoStatus>=200 && _zaikoStatus<300);
  }).catch(function(e){
    console.error('zaiko POST error:', e);
    // iOS(PWA含む)など一部環境で CORS/ネットワーク都合によりレスポンス取得だけ失敗する場合がある。
    // その場合でもサーバ側には反映される可能性があるため、呼び出し側で許可されたときは成功扱いにする。
    if(treatFetchErrorAsSuccess) return true;
    return false;
  });
}
function postZaikoConsumptionWeeklyFor(sourceStorageKey, opts){
  try{
    const url=zaikoGasUrl();
    console.log('zaiko GAS URL:', zaikoGasUrl());
    try{
      window._zaikoDebug = window._zaikoDebug || {};
      window._zaikoDebug.postCalledAt = Date.now();
      window._zaikoDebug.zaikoGasUrl = url;
      localStorage.setItem('zaiko_debug_postCalledAt', String(window._zaikoDebug.postCalledAt));
      localStorage.setItem('zaiko_debug_zaikoGasUrl', url || '');
    }catch(_){}
    if(!url) return Promise.resolve(false);
    const src=String(sourceStorageKey||'kaigo_nishi').trim()||'kaigo_nishi';
    let raw='';
    try{ raw=localStorage.getItem(src)||''; }catch(_){ raw=''; }
    if(!raw) return Promise.resolve(false);
    let j=null;
    try{ j=JSON.parse(raw); }catch(_){ j=null; }
    const products=(j&&j.settings&&Array.isArray(j.settings.supplyProducts))?j.settings.supplyProducts.map(x=>String(x||'').trim()).filter(Boolean):[];
    if(!products.length) return Promise.resolve(false);
    const getUrl=zaikoGasUrlWithTokenQuery();
    return fetch(getUrl,{method:'GET'})
      .then(r=>{
        if(!r.ok) throw new Error('GET '+r.status);
        const ct=(r.headers.get('content-type')||'').toLowerCase();
        if(ct.includes('application/json')) return r.json();
        return r.text().then(t=>{ try{ return JSON.parse(t); }catch(_){ return {}; } });
      })
      .then(data=>{
        const resetAt=zaikoExtractResetAtFromGetJson(data);
        const consumed=_sumSuppliesFromDate(resetAt, products, src);
        return postZaikoConsumed(consumed, opts);
      })
      .catch(e=>{
        console.warn('zaiko GET failed; fallback to month-only sum', e);
        const consumed=_sumSuppliesFromDate('', products, src);
        return postZaikoConsumed(consumed, opts);
      });
  }catch(_){
    return Promise.resolve(false);
  }
}

      day:''
    };

  if(!r.excretion) r.excretion=[];
  if(!r.bath) r.bath=[];
  if(!r.care) r.care=[];
  if(!r.notes) r.notes=[];
  if(!r.med) r.med={morning:{time:'',staff:'',items:[]},lunch:{time:'',staff:'',items:[]},dinner:{time:'',staff:'',items:[]},bedtime:{time:'',staff:'',items:[]}};
  ['morning','lunch','dinner','bedtime'].forEach(t=>{
    if(!r.med[t]) r.med[t]={time:'',staff:'',items:[]};
    if(!r.med[t].items) r.med[t].items=[];
  });
  if(!r.meal){
    r.meal={bTime:'07:30',bMain:100,bSide:100,bWater:'',
          time:'11:50',menu:'',snack:'',main:100,side:100,water:'',
          dTime:'17:30',dMain:100,dSide:100,dWater:''};
  }
  // v3追加フィールド
  if(r.calculated === undefined) r.calculated = false;

  // calcTransportTypeはnullを「未設定」として扱う（undefinedのみ初期化しない）

/**
 * iOS「ホーム画面に追加」スタンドアロンは、Safari 本体と localStorage が分離することがある。
 * 同一オリジンでは Cookie が共有されることが多いため、GAS URL／トークン／施設IDを Cookie にもミラーし、
 * 起動時に localStorage が空なら Cookie から復元する。
 */
function gasCookieSuffix(){
  const sec=location.protocol==='https:'?';Secure':'';
  return ';path=/;max-age=34560000;SameSite=Lax'+sec;
}
function gasReadCookie(name){
  try{
    const cs=document.cookie?document.cookie.split('; '):[];
    for(let i=0;i<cs.length;i++){
      const p=cs[i].indexOf('=');
      if(p<1) continue;
      const k=cs[i].slice(0,p).trim();
      if(k!==name) continue;
      return decodeURIComponent(cs[i].slice(p+1).trim());
    }
    return '';
  }catch(_){ return ''; }
}
function gasWriteCookie(name, val){

/** GAS credentials backup key (same origin). Repairs missing primary keys on load. */
const KAIGO_GAS_SNAP_KEY='kaigo_gas_cred_v1';
function gasSnapshotRead(){
  try{
    const raw=localStorage.getItem(KAIGO_GAS_SNAP_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object') return null;
    return {url:String(o.url||'').trim(), token:String(o.token||'').trim()};
  }catch(_){ return null; }
}
/** primary とスナップショットをマージして保存 */
function gasSnapshotWrite(){
  try{
    const pu=(localStorage.getItem('kaigo_gas_webapp_url')||'').trim();
    const pt=(localStorage.getItem('kaigo_gas_token')||'').trim();
    const old=gasSnapshotRead();
    const url=pu||(old&&old.url)||'';
    const token=pt||(old&&old.token)||'';
    if(!url&&!token){ localStorage.removeItem(KAIGO_GAS_SNAP_KEY); return; }
    localStorage.setItem(KAIGO_GAS_SNAP_KEY, JSON.stringify({url, token}));
  }catch(_){}
}
function gasSnapshotBootstrapIfNeeded(){
  try{
    if(localStorage.getItem(KAIGO_GAS_SNAP_KEY)) return;
    const u=(localStorage.getItem('kaigo_gas_webapp_url')||'').trim();
    const t=(localStorage.getItem('kaigo_gas_token')||'').trim();
    if(u||t) localStorage.setItem(KAIGO_GAS_SNAP_KEY, JSON.stringify({url:u, token:t}));
  }catch(_){}
}
function gasSnapshotRepairFromPrimary(){
  try{
    const snap=gasSnapshotRead();
    if(!snap) return;
    if(!gasUrl()&&snap.url) localStorage.setItem('kaigo_gas_webapp_url', snap.url);
    if(!gasToken()&&snap.token) localStorage.setItem('kaigo_gas_token', snap.token);
  }catch(_){}
}

/** 同一ブラウザ・同一タブ用のミラー。別タブ／別端末とは共有されません */
const KAIGO_GAS_SESS_KEY='kaigo_gas_mirror_v1';
function gasMirrorToSession(){
  try{
    const u=localStorage.getItem('kaigo_gas_webapp_url')||'';
    const t=localStorage.getItem('kaigo_gas_token')||'';
    if(u||t) sessionStorage.setItem(KAIGO_GAS_SESS_KEY, JSON.stringify({u,t}));
  }catch(_){}
  gasSnapshotWrite();
}
function gasRestoreFromSessionIfNeeded(){
  try{
    if(gasUrl()&&gasToken()){ gasMirrorToSession(); return; }
    const s=sessionStorage.getItem(KAIGO_GAS_SESS_KEY);
    if(!s) return;
    const o=JSON.parse(s);
    if(!o||typeof o!=='object') return;
    if(!gasUrl()&&o.u) localStorage.setItem('kaigo_gas_webapp_url', String(o.u));
    if(!gasToken()&&o.t) localStorage.setItem('kaigo_gas_token', String(o.t));
    if(gasUrl()||gasToken()) gasMirrorToSession();
  }catch(_){}
}
function gasCredentialsInit(){
  gasRepairFromCookieMirror();
  gasRestoreFromSessionIfNeeded();
  gasSnapshotBootstrapIfNeeded();
  gasSnapshotRepairFromPrimary();
  gasRepairFromCookieMirror();
  if(gasUrl()&&gasToken()) gasMirrorToSession();
  if(gasUrl()||gasToken()||(localStorage.getItem('kaigo_last_facility')||'').trim()) gasMirrorToCookies();
}

/**
 * 利用者のサービス種別（シート列 serviceType・内部のみ。画面に種別は出さない）
 * resident: 入所・常時利用
 * day: デイサービス（宿泊なし想定。最終排便列は「利用者管理」でデイ時は —）
 */
function normalizeResidentServiceType(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  if(s==='day'||s==='ds'||s==='デイ'||s==='デイサービス') return 'day';
  return 'resident';
}
/**
 * 予定が全日1なら入所扱い、それ以外はデイ扱い（serviceType 列が無いときの推定）。
 * ※全日1のデイ利用者はサービス種別の推定だけでは入所に見える場合があるが、表示は利用者管理 residentTypes を優先する。
 */
function inferServiceTypeFromSched(sched){
  if(!Array.isArray(sched)||sched.length===0) return 'resident';
  if(sched.every(v=>Number(v)===1)) return 'resident';
  return 'day';
}
/** シート列 serviceType（あれば優先）＋無ければ sched から推定 */
function residentServiceTypeFromSheet(svcRaw, sched){
  if(svcRaw!==undefined&&svcRaw!==null&&String(svcRaw).trim()!=='')
    return normalizeResidentServiceType(svcRaw);
  return inferServiceTypeFromSched(sched);
}
function residentServiceTypeOrDefault(r){
  if(!r) return 'resident';
  if(r.serviceType!=null&&String(r.serviceType).trim()!=='')
    return normalizeResidentServiceType(r.serviceType);
  return inferServiceTypeFromSched(r.sched);
}
/**
 * 「入所／デイ」の表示・集計判定。予定表Excelの列構造には依存しない。
 * db.settings.residentTypes にある氏名は最優先。無い場合は resident 行の serviceType＋sched。
 * residents にいない氏名だけ「day」固定。
 */
function getResidentClassification(name, settingsOpt, residentsOpt){
  const nm=normalizeResidentName(name||'');
  if(!nm) return 'day';
  const S=(settingsOpt!==undefined&&settingsOpt!==null)?settingsOpt:(typeof db!=='undefined'&&db&&db.settings);
  const rt=S&&S.residentTypes;
  if(rt&&typeof rt==='object'&&!Array.isArray(rt)){
    for(const k of Object.keys(rt)){
      if(normalizeResidentName(k)===nm){
        const v=String(rt[k]==null?'':rt[k]).trim().toLowerCase();
        if(v==='inpatient'||v==='resident'||v==='入所') return 'inpatient';
        return 'day';
      }
    }
  }
  const resList=(residentsOpt!==undefined&&residentsOpt!==null)?residentsOpt:((typeof db!=='undefined'&&db&&db.residents)||[]);
  const r=(resList||[]).find(x=>normalizeResidentName(x&&x.name)===nm);
  if(r){
    const sched=Array.isArray(r.sched)?r.sched:[];
    if(sched.length>0&&!sched.some(v=>Number(v)===1)) return 'day';
    return inferServiceTypeFromSched(sched)==='day'?'day':'inpatient';
  }
  return 'day';
}
function ensureResidentTypeAbsentOnly(nameFromImport){
  db.settings=db.settings||{};
  db.settings.residentTypes=db.settings.residentTypes||{};
  const nk=normalizeResidentName(nameFromImport);
  if(!nk) return;
  const exists=Object.keys(db.settings.residentTypes).some(k=>normalizeResidentName(k)===nk);
  if(exists) return;
  db.settings.residentTypes[nk]='day';
  touchSetU('residentTypes');
}

/** 食事「未入力・全削除後」と同じ初期値か（_u は見ない。同期マージで削除を勝たせるには _u を新しくすること） */
function mealIsBlankDefaultState(m){
  if(!m) return true;
  const nm=(x)=>String(normalizeMealFreeText(x)||'').trim();
  const bt=normalizeTimeText(m.bTime)||'07:30';
  const lt=normalizeTimeText(m.time)||'11:50';
  const dt=normalizeTimeText(m.dTime)||'17:30';
  if(bt!=='07:30'||lt!=='11:50'||dt!=='17:30') return false;
  if(Number(m.bMain)!==100||Number(m.bSide)!==100) return false;
  if(Number(m.main)!==100||Number(m.side)!==100) return false;
  if(Number(m.dMain)!==100||Number(m.dSide)!==100) return false;
  if(String(m.bWater||'').trim()||String(m.water||'').trim()||String(m.dWater||'').trim()) return false;
  if(nm(m.menu)||nm(m.snack)) return false;
  return true;
}
function mealRowHasData(m){
  if(!m) return false;
  if(mealIsBlankDefaultState(m)) return false;
  return true;
}
/** シート出力・履歴表示用：中身が空でも削除や保存で _u / bU / lU / dU が付いていれば行を残す（未送信だと「消えない」ように見える） */
function mealRowHasDataOrSyncMeta(m){
  if(!m) return false;
  if(mealRowHasData(m)) return true;
  return !!(_numU(m._u) || _numU(m.bU) || _numU(m.lU) || _numU(m.dU));
}

/** スプレッドシートの時刻セルが誤って meal_menu / meal_snack に ISO（1899-12-30…）で入った場合に空へ正規化 */
function normalizeMealFreeText(v){
  if(v instanceof Date && !isNaN(v)){
    const y=v.getUTCFullYear(), mo=v.getUTCMonth(), da=v.getUTCDate();
    if(y===1899&&mo===11&&(da===30||da===31)) return '';
  }
  const s=String(v==null?'':v).trim();
  if(!s) return '';
  if(/^1899-12-3[01]T/i.test(s)) return '';
  const t=Date.parse(s);
  if(!isNaN(t)){
    const d=new Date(t);
    const y=d.getUTCFullYear(), mo=d.getUTCMonth(), da=d.getUTCDate();
    if(y===1899&&mo===11&&(da===30||da===31)) return '';
  }
  return s;
}

function blankRecRow(){ return Array(N_RECORD_COLS).fill(''); }

function dbToSheet(inDb){
  const resH=buildResidentHeaderRow();
  const recH=buildRecordHeaderRow();
  const W=Math.max(resH.length, recH.length, 56);
  const rows=[];
  const PR=r=>padSheetRow(r,W);

  rows.push(PR([SYNC_MARKER]));
  rows.push(PR([SEC_RES]));
  rows.push(PR(resH));
  (inDb.residents||[]).forEach(r=>{
    const row=[r.id||'',r.name||'',r.care||''];
    const sch=r.sched||[];
    for(let di=0;di<31;di++) row.push(sch[di]===1?1:0);
    row.push(_numU(r._u));
    row.push(getResidentClassification(r.name, inDb.settings, inDb.residents)==='inpatient'?'resident':'day');
    row.push(String(r.insuredNumber||''));
    row.push(String(r.careManagerOffice||''));
    row.push(String(r.careManagerName||''));
    row.push(String(r.birthDate||''));
    row.push(String(r.careExpiry||''));
    row.push(String(r.costShare||''));
    row.push(String(r.startTime||''));
    row.push(String(r.endTime||''));
    row.push(r.sameBuilding?'1':'0');
    row.push(String(r.transportType||'both'));
    row.push(String(r.serviceCodeKey||''));
    row.push(JSON.stringify(r.addonCodes||[]));
    row.push(String(r.shoguCode||''));
    row.push(String(r.shoguUnit||0));
    row.push(JSON.stringify(r.dailyServiceCodes||{}));
    row.push(JSON.stringify(r.bathSched||[]));
    row.push(String(r.gender||''));
    row.push(String(r.phone||''));
    rows.push(PR(row));
  });
  rows.push(PR([]));
  rows.push(PR([SEC_REC]));
  rows.push(PR(recH));

  const pushR=a=>rows.push(PR(a));

  const recs=normalizeRecordsMap(inDb.records||{});
  Object.keys(recs).sort().forEach(dk=>{
    const day=recs[dk]||{};
    Object.keys(day).sort().forEach(name=>{
      const rec=day[name];
      if(!rec||typeof rec!=='object') return;

        if(!String(v.id||'').trim()) v.id=genId('v');

        a[REC.seq]=String(idx); a[REC.tm]=v.time||'';
        a[REC.v0]=normalizeTempValue(v.temp??''); a[REC.v1]=v.sbp??''; a[REC.v2]=v.dbp??''; a[REC.v3]=v.pulse??''; a[REC.v4]=v.spo2??''; a[REC.v5]=v.weight??''; a[REC.v6]=v.staff||'';
        pushR(a);
      });
      (rec.excretion||[]).forEach((v,idx)=>{
        if(!String(v.id||'').trim()) v.id=genId('e');
        const a=blankRecRow();
        a[REC.rid]=String(v.id);
        a[REC.k]='excretion'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(v.sheetU||v.u||0));
        a[REC.seq]=String(idx); a[REC.tm]=v.time||'';
        a[REC.ex0]=v.urine||''; a[REC.ex1]=v.pad||''; a[REC.ex2]=v.stool||''; a[REC.ex3]=v.writer||'';
        a[REC.ex4]=v.padChange?1:0; a[REC.ex5]=v.rehaChange?1:0; a[REC.ex6]=v.diaperChange?1:0; a[REC.ex7]=v.urineMl||'';
        pushR(a);
      });
      (rec.bath||[]).forEach((v,idx)=>{
        if(!String(v.id||'').trim()) v.id=genId('b');
        const a=blankRecRow();
        a[REC.rid]=String(v.id);
        a[REC.k]='bath'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(v.sheetU||v.u||0));

      const m=rec.meal||{};
      if(mealRowHasDataOrSyncMeta(m)){
        const a=blankRecRow();
        a[REC.rid]='meal|'+dk+'|'+name; a[REC.k]='meal'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(m._u||0));

        a[REC.mdt]=m.dTime||''; a[REC.mdm]=m.dMain??''; a[REC.mds]=m.dSide??''; a[REC.mdw]=m.dWater??'';
        const mealMeta={
          bU:_numU(m.bU),lU:_numU(m.lU),dU:_numU(m.dU),

        if(mealMeta.bU||mealMeta.lU||mealMeta.dU||mealMeta.bDel||mealMeta.lDel||mealMeta.dDel) a[REC.exj]=JSON.stringify(mealMeta);
        pushR(a);
      }

      const med=rec.med||{};
      ['morning','lunch','dinner','bedtime'].forEach(timing=>{

        pushR(a);
      });

      const rc=rec.rec||{};
      if(rc.content||(rc.chips&&rc.chips.length)||rc.kanken||rc.time||rc.part){
        const a=blankRecRow();
        a[REC.rid]='rec|'+dk+'|'+name; a[REC.k]='rec'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(rc._u||0));
        a[REC.seq]='0'; a[REC.tm]=rc.time||'';
        a[REC.rp]=rc.part||''; a[REC.rc]=rc.content||''; a[REC.rk]=rc.kanken?1:0; a[REC.rch]=JSON.stringify(rc.chips||[]);
        pushR(a);
      }

      if(rec.day || rec.dayWriter || (rec._dayU||0)>0){
        const a=blankRecRow();
        a[REC.rid]='day|'+dk+'|'+name; a[REC.k]='day'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(rec._dayU||0));
        a[REC.seq]='0'; a[REC.tm]='';
        a[REC.dt]=String(rec.day||'').replace(/\r/g,' '); a[REC.dw]=rec.dayWriter||'';
        pushR(a);
      }

      // calc系フィールド（算定確定データ）をシートに出力
      if(rec.calculated || (rec._calcU||0)>0){
        const a=blankRecRow();
        a[REC.rid]='calc|'+dk+'|'+name; a[REC.k]='calc'; a[REC.dk]=dk; a[REC.nm]=name; a[REC.uu]=String(_numU(rec._calcU||0));
        a[REC.seq]='0'; a[REC.tm]='';
        a[REC.exj]=JSON.stringify({
          calculated:     !!rec.calculated,
          calcStartTime:  rec.calcStartTime||'',
          calcEndTime:    rec.calcEndTime||'',
          calcServiceCodeKey: rec.calcServiceCodeKey||'',
          calcAddons:     Array.isArray(rec.calcAddons)?rec.calcAddons:[],
          bathCalculated: !!rec.bathCalculated,
          calcTransportType: rec.calcTransportType!=null?rec.calcTransportType:null,
          calcU:          _numU(rec._calcU||0)
        });
        pushR(a);
      }
    });
  });

  rows.push(PR([]));
  rows.push(PR([SEC_SET]));
  rows.push(PR(['key','valueJson','updatedAt']));
  const S=inDb.settings||{};
  const skip=new Set(['logoB64']);
  if(!inDb._setU) inDb._setU={};
  Object.keys(S).forEach(k=>{
    if(skip.has(k)) return;
    const v=S[k];
    rows.push(PR([k, JSON.stringify(v), String(_numU(inDb._setU&&inDb._setU[k]))]));
  });

  rows.push(PR([]));
  rows.push(PR([SEC_SUP]));
  rows.push(PR(['id','date','resName','product','qty','staff','updatedAt']));
  (inDb.supplies||[]).forEach(s=>{
    rows.push(PR([s.id||'', s.date||'', s.resName||'', s.product||'', s.qty??'', String(s.staff||''), String(_numU(s._u||0))]));
  });

  return rows;
}

function ensureDay(dbOut, dk, name){
  if(!dbOut.records[dk]) dbOut.records[dk]={};
  if(!dbOut.records[dk][name]){
    dbOut.records[dk][name]={
      vital:[], excretion:[], bath:[], care:[], notes:[],
      meal:{bTime:'07:30',bMain:100,bSide:100,bWater:'', time:'11:50',menu:'',snack:'',main:100,side:100,water:'', dTime:'17:30',dMain:100,dSide:100,dWater:''},
      med:{morning:{time:'',staff:'',items:[]},lunch:{time:'',staff:'',items:[]},dinner:{time:'',staff:'',items:[]},bedtime:{time:'',staff:'',items:[]}},
      rec:{content:'',part:'',time:''},
      day:''
    };
  }
  const r=dbOut.records[dk][name];
  ['vital','excretion','bath','care','notes'].forEach(f=>{ if(!r[f]) r[f]=[]; });
  if(!r.med) r.med={morning:{time:'',staff:'',items:[]},lunch:{time:'',staff:'',items:[]},dinner:{time:'',staff:'',items:[]},bedtime:{time:'',staff:'',items:[]}};
  ['morning','lunch','dinner','bedtime'].forEach(t=>{
    if(!r.med[t]) r.med[t]={time:'',staff:'',items:[]};
    if(!r.med[t].items) r.med[t].items=[];
  });
  if(!r.rec) r.rec={content:'',part:'',time:''};
  return r;
}

function buildCareRecordExj(v){
  const exj={};
  if(v&&(v.forwardToNotes||v.forwardNoteId)){
    exj.forwardToNotes=!!v.forwardToNotes;
    exj.forwardNoteId=v.forwardNoteId||'';
  }
  if(v&&v.lwSent){
    exj.lwSent=1;
    if(_numU(v.lwSentAt)) exj.lwSentAt=_numU(v.lwSentAt);
  }
  return Object.keys(exj).length?JSON.stringify(exj):'';
}
function buildNotesRecordExj(v){
  const exj={};
  if(v&&v._deleted) exj._deleted=1;
  if(v&&v.lwSent){
    exj.lwSent=1;
    if(_numU(v.lwSentAt)) exj.lwSentAt=_numU(v.lwSentAt);
  }
  return Object.keys(exj).length?JSON.stringify(exj):'';
}
function applyLwSentFromExj(exj, target){
  if(!target||!exj||!exj.lwSent) return;
  target.lwSent=true;
  if(_numU(exj.lwSentAt)) target.lwSentAt=_numU(exj.lwSentAt);
}

function applyRecordRow(dbOut, row){
  row=padSheetRow(Array.isArray(row)?row.slice():[], N_RECORD_COLS);
  const kind=String(row[REC.k]||'').trim();
  const dk=normalizeDateKey(row[REC.dk]);
  const name=String(row[REC.nm]||'').trim();
  const u=_numU(row[REC.uu]);
  const tm=normalizeTimeText(row[REC.tm]);
  if(!dk||!name||!kind) return;
  const rec=ensureDay(dbOut, dk, name);
  let exj={};
  try{ exj=JSON.parse(row[REC.exj]||'{}')||{}; }catch(_){ exj={}; }

  if(kind==='vital'){
    const o={
      id:String(row[REC.rid]||genId('v')),
      time:tm||'', temp:normalizeTempValue(row[REC.v0]), sbp:row[REC.v1], dbp:row[REC.v2], pulse:row[REC.v3], spo2:row[REC.v4], weight:row[REC.v5], staff:row[REC.v6],
      sheetU:u
    };
    rec.vital.push(o);
    return;
  }
  if(kind==='excretion'){
    rec.excretion.push({
      id:String(row[REC.rid]||genId('e')),
      time:tm||'',
      urine:row[REC.ex0], urineMl:row[REC.ex7], pad:row[REC.ex1], stool:row[REC.ex2], writer:row[REC.ex3],
      padChange:!!Number(row[REC.ex4]), rehaChange:!!Number(row[REC.ex5]), diaperChange:!!Number(row[REC.ex6]),
      sheetU:u
    });
    return;
  }
  if(kind==='bath'){
    rec.bath.push({ id:String(row[REC.rid]||genId('b')), time:tm||'', type:row[REC.ba0], staff:row[REC.ba1], sheetU:u });
    return;
  }
  if(kind==='care'){
    const careRow={
      id:String(row[REC.rid]||genId('c')),
      time:tm||'',
      content:row[REC.ca0],
      staff:row[REC.ca1],
      forwardToNotes:!!exj.forwardToNotes,
      forwardNoteId:exj.forwardNoteId||'',
      sheetU:u
    };
    applyLwSentFromExj(exj, careRow);
    rec.care.push(careRow);
    return;
  }
  if(kind==='notes'){
    const noteRow={
      id:String(row[REC.rid]||genId('n')),
      time:tm||'',
      content:row[REC.nt0],
      writer:row[REC.nt1],
      ts:row[REC.nt2]||new Date().toISOString(),
      _deleted:!!Number(exj._deleted||0),
      sheetU:u
    };
    applyLwSentFromExj(exj, noteRow);
    rec.notes.push(noteRow);
    return;
  }
  if(kind==='meal'){
    rec.meal={
      bTime:normalizeTimeText(row[REC.mbt])||'07:30', bMain:_numU(row[REC.mbm])||100, bSide:_numU(row[REC.mbs])||100, bWater:row[REC.mbw]||'',
      time:normalizeTimeText(row[REC.mlt])||'11:50', menu:normalizeMealFreeText(row[REC.mm])||'', snack:normalizeMealFreeText(row[REC.msk])||'', main:_numU(row[REC.mlmi])||100, side:_numU(row[REC.mls])||100, water:row[REC.mlw]||'',
      dTime:normalizeTimeText(row[REC.mdt])||'17:30', dMain:_numU(row[REC.mdm])||100, dSide:_numU(row[REC.mds])||100, dWater:row[REC.mdw]||'',
      bU:_numU(exj.bU), lU:_numU(exj.lU), dU:_numU(exj.dU),
      bDel:!!Number(exj.bDel||0), lDel:!!Number(exj.lDel||0), dDel:!!Number(exj.dDel||0),
      _u:u
    };
    return;
  }
  if(kind==='med'){
    const timing=String(row[REC.mt]||'morning');
    let items=[];
    try{ items=JSON.parse(row[REC.mj]||'[]')||[]; }catch(_){ items=[]; }
    rec.med[timing]={ time:row[REC.mtt]||'', staff:row[REC.mts]||'', items, _u:u };
    return;
  }
  if(kind==='rec'){
    let chips=[];
    try{ chips=JSON.parse(row[REC.rch]||'[]')||[]; }catch(_){ chips=[]; }
    rec.rec={ time:tm||'', part:row[REC.rp]||'', content:row[REC.rc]||'', kanken:!!Number(row[REC.rk]), chips, _u:u };
    return;
  }
  if(kind==='day'){
    rec.day=row[REC.dt]||''; rec.dayWriter=row[REC.dw]||''; rec._dayU=u;
  }
  if(kind==='calc'){
    let calcData={};
    try{ calcData=JSON.parse(row[REC.exj]||'{}'); }catch(_){ calcData={}; }
    rec._calcU=Math.max(_numU(row[REC.uu]), _numU(calcData.calcU));
    rec.calculated=!!calcData.calculated;
    rec.calcStartTime=calcData.calcStartTime||'';
    rec.calcEndTime=calcData.calcEndTime||'';
    rec.calcServiceCodeKey=calcData.calcServiceCodeKey||'';
    rec.calcAddons=Array.isArray(calcData.calcAddons)?calcData.calcAddons:[];
    rec.bathCalculated=!!calcData.bathCalculated;
    if(calcData.calcTransportType!=null) rec.calcTransportType=calcData.calcTransportType;
  }
}

/** A1 がずれていると sheetToDb が空になり「取得は成功したが反映されない」になる */
function normalizeSyncMarkerCell(v){
  return String(v==null?'':v).replace(/\uFEFF/g,'').trim();
}
function sheetTopCell(rows){
  if(!rows||!rows.length||!rows[0]||!rows[0].length) return '';
  return normalizeSyncMarkerCell(rows[0][0]);
}
function localDbHasSyncableData(){
  return (db.residents||[]).length>0
    || Object.keys(db.records||{}).length>0
    || (db.supplies||[]).length>0;
}
function sheetHasValidSyncMarker(rows){
  return sheetTopCell(rows)===SYNC_MARKER;
}
/** マーカー不正だが「完全な空シート」なら false（従来どおり sheetToDb→空マージでよい） */
function sheetLooksLikeCorruptMarker(rows){
  if(!rows||!rows.length||sheetHasValidSyncMarker(rows)) return false;
  const t=sheetTopCell(rows);
  if(rows.length===1 && !t) return false;
  return true;
}
/** A1だけ不正でも RESIDENTS/RECORDS 等があれば読み取る（A1修復前のシートデータ温存用） */
function sheetHasKaigoSectionStructure(rows){
  if(!rows||!rows.length) return false;
  for(let i=0;i<rows.length;i++){
    const c0=String(rows[i][0]||'').trim();
    if(c0===SEC_RES||c0===SEC_REC||c0===SEC_SET||c0===SEC_SUP) return true;
  }
  return false;
}
function sheetToDbLenient(rows){
  if(!rows||!rows.length) return sheetToDb(rows);
  if(sheetHasValidSyncMarker(rows)) return sheetToDb(rows);
  if(!sheetHasKaigoSectionStructure(rows)) return sheetToDb([]);
  return sheetToDb([[SYNC_MARKER]].concat(rows));
}
function countRecordDaysInDbObj(d){
  return Object.keys((d&&d.records)||{}).length;
}

function sheetToDb(rows){
  const empty=()=>({ residents:[], records:{}, supplies:[], settings:cloneDeep(DEFAULT_SETTINGS), _setU:{} });
  if(!rows||!rows.length||sheetTopCell(rows)!==SYNC_MARKER) return empty();

  const dbOut=empty();
  let i=1;
  while(i<rows.length && String(rows[i][0])!==SEC_RES) i++;
  if(i>=rows.length) return dbOut;
  i++;
  i++;
  while(i<rows.length){
    const r=rows[i];
    if(!r||!r.length){ i++; continue; }
    if(String(r[0])===SEC_REC) break;
    const name=String(r[1]||'').trim();
    const id=String(r[0]||'').trim();
    if(!name && !id){ i++; continue; }
    const care=String(r[2]||'');
    const sched=[];
    for(let c=3;c<34;c++) sched.push(Number(r[c])===1?1:0);
    while(sched.length<31) sched.push(0);
    dbOut.residents.push({
      id:id||genId('r'), name, care, sched, _u:_numU(r[34]),
      serviceType:     residentServiceTypeFromSheet(r[35], sched),
      insuredNumber:   String(r[36]||''),
      careManagerOffice: String(r[37]||''),
      careManagerName: String(r[38]||''),
      birthDate:       String(r[39]||''),
      careExpiry:      String(r[40]||''),
      costShare:       String(r[41]||''),
      startTime:       String(r[42]||''),
      endTime:         String(r[43]||''),
      sameBuilding:    r[44]==='1'||Number(r[44])===1,
      transportType:   String(r[45]||'both'),
      serviceCodeKey:  String(r[46]||''),
      addonCodes:      (function(){try{return JSON.parse(r[47]||'[]');}catch(e){return [];}}()),
      shoguCode:       String(r[48]||''),
      shoguUnit:       Number(r[49]||0),
      dailyServiceCodes: (function(){try{return JSON.parse(r[50]||'{}');}catch(e){return {};}}()),
      bathSched:         (function(){try{
    const v=JSON.parse(r[51]||'[]');
    return Array.isArray(v)?v:new Array(31).fill(0);
  }catch(e){return new Array(31).fill(0);}}()),
      gender:            String(r[52]||''),
      phone:             String(r[53]||''),
    });
    i++;
  }
  while(i<rows.length && String(rows[i][0])!==SEC_REC) i++;
  if(i>=rows.length) return dbOut;
  i+=2;
  while(i<rows.length){
    const r=rows[i];
    if(!r||!r.length){ i++; continue; }
    const c0=String(r[0]||'');
    if(c0===SEC_SET||c0===SEC_SUP) break;
    applyRecordRow(dbOut, r);
    i++;
  }

  while(i<rows.length && String(rows[i][0])!==SEC_SET) i++;
  if(i<rows.length && String(rows[i][0])===SEC_SET){
    i+=2;
    while(i<rows.length){
      const r=rows[i];
      if(!r||!r.length){ i++; continue; }
      if(String(r[0])===SEC_SUP) break;
      const k=String(r[0]||'').trim();
      if(!k){ i++; continue; }
      try{ dbOut.settings[k]=JSON.parse(r[1]); }catch(_){ dbOut.settings[k]=r[1]; }
      dbOut._setU[k]=_numU(r[2]);
      i++;
    }
  }

  while(i<rows.length && String(rows[i][0])!==SEC_SUP) i++;
  if(i<rows.length && String(rows[i][0])===SEC_SUP){
    i+=2;
    while(i<rows.length){
      const r=rows[i];
      if(!r||!r.length){ i++; continue; }
      const id=String(r[0]||'').trim();
      if(!id){ i++; continue; }
      let staff='', _u;
      if(r.length>=7){
        staff=String(r[5]||'');
        _u=_numU(r[6]);
      }else{
        _u=_numU(r[5]);
      }
      dbOut.supplies.push({ id, date:String(r[1]||''), resName:String(r[2]||''), product:String(r[3]||''), qty:_numU(r[4]), staff, _u });
      i++;
    }
  }

  Object.keys(dbOut.records||{}).forEach(dk=>{
    Object.keys(dbOut.records[dk]||{}).forEach(nm=>{
      const rr=dbOut.records[dk][nm];
      coalesceDayTimedArrays(rr);
      ['vital','excretion','bath','care','notes'].forEach(f=>{
        if(rr[f]) rr[f].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      });
    });
  });
  dbOut.supplies.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  dbOut.records=normalizeRecordsMap(dbOut.records||{});
  return dbOut;
}

function normalizeRecordsMap(records){
  const out={};
  Object.keys(records||{}).forEach(rawKey=>{
    const nk=normalizeDateKey(rawKey);
    if(!nk) return;
    const day=records[rawKey]||{};
    if(!out[nk]) out[nk]={};
    Object.keys(day).forEach(nm=>{
      if(!out[nk][nm]) out[nk][nm]=cloneDeep(day[nm]);
      else out[nk][nm]=mergeRecordDay(out[nk][nm], day[nm], nk, nm);
    });
  });
  return out;
}

function normalizeVitalTempsInRecords(records){
  Object.keys(records||{}).forEach(dk=>{
    Object.keys((records[dk]||{})).forEach(nm=>{
      const rec=records[dk][nm];
      if(!rec||!Array.isArray(rec.vital)) return;
      rec.vital.forEach(v=>{
        if(!v) return;
        v.temp=normalizeTempValue(v.temp);
      });
    });
  });
}

/** 利用者一覧の並びを端末・同期のたびに固定（氏名→id。入力・閲覧のブレ防止） */
function normalizeResidentName(name){
  return String(name||'').replace(/[\s\u3000]+/g,' ').trim();
}
function compareResidentsStable(a,b){
  const c=normalizeResidentName((a&&a.name)||'').localeCompare(normalizeResidentName((b&&b.name)||''),'ja');
  if(c!==0) return c;
  return String((a&&a.id)||'').localeCompare(String((b&&b.id)||''));
}
/** チップ data-name 等と db.residents の突き合わせ（空白差で find 失敗→誤って入所扱いになるのを防ぐ） */
function dbResidentByNameLoose(name){
  const nm=normalizeResidentName(name);
  if(!nm) return null;
  return (db.residents||[]).find(x=>normalizeResidentName(x.name)===nm)||null;
}
/**
 * 日オブジェクト { 氏名: レcord } から1名分のレコードを取る。キーは同期前後で空白等がずれる。
 */
function getRecordInDayByResidentName(day, resName){
  if(!day||!resName) return null;
  if(resName in day) return day[resName]||null;
  const want=normalizeResidentName(resName);
  for(const k of Object.keys(day)){
    if(normalizeResidentName(k)===want) return day[k]||null;
  }
  return null;
}
function getDayRecordByResidentName(dkKey, resName){
  return getRecordInDayByResidentName(db.records[dkKey]||{}, resName);
}
/** デイ（通所）扱いか。利用者管理の区分・利用者行の serviceType を参照（氏名のみキーはデイ想定） */
function isDayServiceByName(name){
  return getResidentClassification(name)!=='inpatient';
}
/**
 * 食事の朝食/夕食セクションが「明示的に記録された」か判定。
 * 主食/副食が初期値100のまま、かつ水分が空ならスタッフは入力していない（デフォルト）と見なす。
 * デイサービス利用者は朝食・夕食をとらない想定のため、デフォルトのままの値は「記録なし」として扱い、
 * 昼食のみ入力したはずが朝食・夕食も100%摂取と表示されてしまう不具合を防ぐ。
 */
function mealSectionExplicitlyRecorded(m, section){
  if(!m) return false;
  if(section==='breakfast' && !!Number(m.bDel||0)) return false;
  if(section==='lunch' && !!Number(m.lDel||0)) return false;
  if(section==='dinner' && !!Number(m.dDel||0)) return false;
  /** bU/lU/dU は同期マージ用。ここで「>0 なら記録あり」とすると削除直後も常に表示されてしまうため使わない */
  if(section==='breakfast'){
    if(String(m.bWater||'').trim()) return true;
    const mv=Number(m.bMain), sv=Number(m.bSide);
    if(Number.isFinite(mv)&&mv!==100) return true;
    if(Number.isFinite(sv)&&sv!==100) return true;
    return false;
  }
  if(section==='dinner'){
    if(String(m.dWater||'').trim()) return true;
    const mv=Number(m.dMain), sv=Number(m.dSide);
    if(Number.isFinite(mv)&&mv!==100) return true;
    if(Number.isFinite(sv)&&sv!==100) return true;
    return false;
  }
  if(String(normalizeMealFreeText(m.menu)||'').trim()) return true;
  if(String(normalizeMealFreeText(m.snack)||'').trim()) return true;
  if(String(m.water||'').trim()) return true;
  const mv=Number(m.main), sv=Number(m.side);
  if(Number.isFinite(mv)&&mv!==100) return true;
  if(Number.isFinite(sv)&&sv!==100) return true;
  return false;
}
/** そのセクションを表示すべきか（デイ利用者は明示入力があるときのみ朝食・夕食を表示） */
function shouldShowMealSection(m, section, residentName){
  if(section==='lunch') return true;
  if(!isDayServiceByName(residentName)) return true;
  return mealSectionExplicitlyRecorded(m, section);
}
function normalizeResidentsOrder(){
  if(!db||!Array.isArray(db.residents)) return;
  db.residents.sort(compareResidentsStable);
}

function _recordItemU(x){
  return _numU(x.sheetU||x.u||0);
}

/** シートの揺らぎ別ID・取込重複をまとめるための内容キー（同一時刻の別測定は値が違えば別行のまま） */
function vitalFingerprint(v){
  return [
    normalizeTimeText((v&&v.time)||''),
    normalizeTempValue((v&&v.temp)??''),
    String((v&&v.sbp)??''),
    String((v&&v.dbp)??''),
    String((v&&v.pulse)??''),
    String((v&&v.spo2)??''),
    String((v&&v.weight)??''),
    String((v&&v.staff)||'').trim()
  ].join('\x1e');
}
function excretionFingerprint(e){
  return [
    normalizeTimeText((e&&e.time)||''),
    String((e&&e.urine)||''),
    String((e&&e.urineMl)||''),
    String((e&&e.pad)||''),
    String((e&&e.stool)||''),
    String((e&&e.writer)||'').trim(),
    e&&e.padChange?1:0,
    e&&e.rehaChange?1:0,
    e&&e.diaperChange?1:0
  ].join('\x1e');
}
function bathFingerprint(b){
  return [
    normalizeTimeText((b&&b.time)||''),
    String((b&&b.type)||''),
    String((b&&b.staff)||'').trim()
  ].join('\x1e');
}
function careFingerprint(c){
  return [
    normalizeTimeText((c&&c.time)||''),
    String((c&&c.content)||''),
    String((c&&c.staff)||'').trim()
  ].join('\x1e');
}
function notesFingerprint(n){
  return [
    normalizeTimeText((n&&n.time)||''),
    String((n&&n.content)||''),
    String((n&&n.writer)||'').trim(),
    String((n&&n.ts)||'')
  ].join('\x1e');
}
function isActiveNote(n){
  if(!n||n._deleted) return false;
  return String(n.content||'').trim().length>0;
}

/**
 * 同一 id は sheetU 最大の1件にし、さらに同一フィンガープリントは1件にまとめる（同期・再取込の重複根絶）。
 */
function preserveLwSentOnRecordItem(keep, other){
  if(!keep||!other||!other.lwSent) return keep;
  keep.lwSent=true;
  keep.lwSentAt=Math.max(_numU(keep.lwSentAt),_numU(other.lwSentAt));
  return keep;
}
function coalesceSameKindItems(items, fpFn, idPrefix, delKind){
  const delMap=recordItemDelMapActive();
  let list=(items||[]).map(x=>cloneDeep(x));
  if(delKind) list=list.filter(x=>!shouldDropMergedRecordItem(delKind, x, delMap));
  list.forEach(x=>{
    if(!String((x&&x.id)||'').trim()) x.id=genId(idPrefix);
  });
  const byId=new Map();
  list.forEach(x=>{
    const id=String(x.id||'').trim();
    const u=_recordItemU(x);
    const old=byId.get(id);
    if(!old||u>old.u){
      const nx=cloneDeep(x);
      if(old) preserveLwSentOnRecordItem(nx, old.x);
      byId.set(id,{x:nx,u});
    }else{
      const nx=cloneDeep(old.x);
      preserveLwSentOnRecordItem(nx, x);
      byId.set(id,{x:nx,u});
    }
  });
  const byFp=new Map();
  byId.forEach(({x,u})=>{
    const fp=fpFn(x);
    const old=byFp.get(fp);
    if(!old||u>old.u){
      const nx=cloneDeep(x);
      if(old) preserveLwSentOnRecordItem(nx, old.x);
      byFp.set(fp,{x:nx,u});
    }else{
      const nx=cloneDeep(old.x);
      preserveLwSentOnRecordItem(nx, x);
      byFp.set(fp,{x:nx,u});
    }
  });
  return [...byFp.values()].map(o=>o.x).sort((a,b)=>
    normalizeTimeText((a&&a.time)||'').localeCompare(normalizeTimeText((b&&b.time)||''))
  );
}

function coalesceDayTimedArrays(rec){
  if(!rec||typeof rec!=='object') return;
  rec.vital=coalesceSameKindItems(rec.vital, vitalFingerprint, 'v', 'v');
  rec.excretion=coalesceSameKindItems(rec.excretion, excretionFingerprint, 'e', 'e');
  rec.bath=coalesceSameKindItems(rec.bath, bathFingerprint, 'b', 'b');
  rec.care=coalesceSameKindItems(rec.care, careFingerprint, 'c', 'c');
  rec.notes=coalesceSameKindItems(rec.notes, notesFingerprint, 'n', null);
}

function coalesceAllRecordArrays(records){
  Object.keys(records||{}).forEach(dk=>{
    Object.keys((records[dk]||{})).forEach(nm=>{
      coalesceDayTimedArrays((records[dk]||{})[nm]);
    });
  });
}

/** 朝・昼・夕は bU/lU/dU で別々にマージ（片方だけ昼削除したときに他端末の昼が丸ごと復活しない） */
function mergeMealSections(Lm, Rm){
  const L=Lm||{}, R=Rm||{};
  const lb=_numU(L.bU), rb=_numU(R.bU);
  const ll=_numU(L.lU), rl=_numU(R.lU);
  const ld=_numU(L.dU), rd=_numU(R.dU);
  const muL=_numU(L._u), muR=_numU(R._u);
  if(!lb&&!rb&&!ll&&!rl&&!ld&&!rd){
    return cloneDeep(muR>muL?(R&&Object.keys(R).length?R:L):(L&&Object.keys(L).length?L:R));
  }
  const pick=(a,b)=>{ if(b>a) return 'R'; if(a>b) return 'L'; return muR>muL?'R':'L'; };
  const sB=pick(lb,rb), sL=pick(ll,rl), sD=pick(ld,rd);
  const B=sB==='R'?R:L, Lt=sL==='R'?R:L, D=sD==='R'?R:L;
  return{
    bTime:normalizeTimeText(B.bTime)||'07:30',
    bMain:_numU(B.bMain)||100,
    bSide:_numU(B.bSide)||100,
    bWater:String(B.bWater||'').trim(),
    time:normalizeTimeText(Lt.time)||'11:50',
    menu:normalizeMealFreeText(Lt.menu)||'',
    snack:normalizeMealFreeText(Lt.snack)||'',
    main:_numU(Lt.main)||100,
    side:_numU(Lt.side)||100,
    water:String(Lt.water||'').trim(),
    dTime:normalizeTimeText(D.dTime)||'17:30',
    dMain:_numU(D.dMain)||100,
    dSide:_numU(D.dSide)||100,
    dWater:String(D.dWater||'').trim(),
    bU:sB==='R'?rb:lb,
    lU:sL==='R'?rl:ll,
    dU:sD==='R'?rd:ld,
    bDel:!!_numU((sB==='R'?R:L).bDel),
    lDel:!!_numU((sL==='R'?R:L).lDel),
    dDel:!!_numU((sD==='R'?R:L).dDel),
    _u:Math.max(muL,muR)
  };
}

function mergeRecordDay(L, R, dk, nm){
  if(!L && !R) return null;
  if(!L){
    const o=cloneDeep(R);
    coalesceDayTimedArrays(o);
    return o;
  }
  if(!R){
    const o=cloneDeep(L);
    coalesceDayTimedArrays(o);
    return o;
  }
  const out=cloneDeep(L);

  out.vital=coalesceSameKindItems([...(L.vital||[]),...(R.vital||[])], vitalFingerprint, 'v', 'v');
  out.excretion=coalesceSameKindItems([...(L.excretion||[]),...(R.excretion||[])], excretionFingerprint, 'e', 'e');
  out.bath=coalesceSameKindItems([...(L.bath||[]),...(R.bath||[])], bathFingerprint, 'b', 'b');
  out.care=coalesceSameKindItems([...(L.care||[]),...(R.care||[])], careFingerprint, 'c', 'c');
  out.notes=coalesceSameKindItems([...(L.notes||[]),...(R.notes||[])], notesFingerprint, 'n', null);

  out.meal=mergeMealSections(L.meal||{}, R.meal||{});

  out.med={ morning:{time:'',staff:'',items:[]}, lunch:{time:'',staff:'',items:[]}, dinner:{time:'',staff:'',items:[]}, bedtime:{time:'',staff:'',items:[]} };
  const delMap=recordItemDelMapActive();
  ['morning','lunch','dinner','bedtime'].forEach(t=>{
    const a=L.med&&L.med[t], b=R.med&&R.med[t];
    const au=_numU(a&&a._u), bu=_numU(b&&b._u);
    const delAt=medSlotDeletedAt(dk, nm, t, delMap);
    const mx=Math.max(au, bu);
    if(delAt>0 && mx<=delAt){
      out.med[t]={time:'',staff:'',items:[],_u:delAt};
    }else{
      out.med[t]= bu>au ? cloneDeep(b||{time:'',staff:'',items:[]}) : cloneDeep(a||{time:'',staff:'',items:[]});
    }
    if(!out.med[t].items) out.med[t].items=[];
  });

  const ruL=_numU((L.rec||{})._u), ruR=_numU((R.rec||{})._u);
  out.rec= ruR>ruL ? cloneDeep(R.rec||{}) : cloneDeep(L.rec||{});

  const duL=_numU(L._dayU), duR=_numU(R._dayU);
  if(duR>duL){ out.day=R.day||''; out.dayWriter=R.dayWriter||''; out._dayU=duR; }
  else { out.day=L.day||''; out.dayWriter=L.dayWriter||''; out._dayU=duL; }

  // calc：_calcU 新しい方を採用。同タイかつ両方0のときだけ「リモートだけ確定」を採用（ローカル解除後に _calcU を進めていればここは来ない）
  const cuL=_numU(L._calcU), cuR=_numU(R._calcU);
  const rOn=!!R.calculated;
  const lOn=!!L.calculated;
  const adoptR=(cuR>cuL)||((cuR===cuL)&&(cuR===0)&&(cuL===0)&&rOn&&!lOn);
  if(adoptR){
    out.calculated       = R.calculated;
    out.calcStartTime    = R.calcStartTime||'';
    out.calcEndTime      = R.calcEndTime||'';
    out.calcServiceCodeKey = R.calcServiceCodeKey||'';
    out.calcAddons       = Array.isArray(R.calcAddons)?[...R.calcAddons]:[];
    out.bathCalculated   = R.bathCalculated||false;
    out.calcTransportType= R.calcTransportType!=null?R.calcTransportType:L.calcTransportType;
    out._calcU           = cuR;
  } else {
    // Lのcalc系はcloneDeepで既にoutに含まれているが明示的に保持
    if(L.calcTransportType!=null) out.calcTransportType=L.calcTransportType;
    out._calcU=cuL;
  }

  return out;
}

function mergeResidentDelMaps(x,y){
  const out={};
  const A=x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  const B=y&&typeof y==='object'&&!Array.isArray(y)?y:{};
  [...new Set([...Object.keys(A),...Object.keys(B)])].forEach(k=>{
    if(!k) return;
    out[k]=Math.max(_numU(A[k]),_numU(B[k]));
  });
  return out;
}
function isInpatientTypeValue(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  return s==='inpatient'||s==='resident'||s==='入所';
}
/** 利用者区分マップを氏名正規化キーでマージ。入所側が一方でもあれば入所を優先（同期で☑が一括消失しないように） */
function mergeResidentTypesMaps(a,b){
  const out={};
  const normVal=new Map();
  function ingest(src){
    if(!src||typeof src!=='object'||Array.isArray(src)) return;
    Object.keys(src).forEach(k=>{
      const nk=normalizeResidentName(k);
      if(!nk) return;
      const v=String(src[k]==null?'':src[k]).trim().toLowerCase()||'day';
      const cur=normVal.get(nk);
      if(cur===undefined){
        normVal.set(nk, isInpatientTypeValue(v)?'inpatient':'day');
      }else if(isInpatientTypeValue(v)||isInpatientTypeValue(cur)){
        normVal.set(nk,'inpatient');
      }else{
        normVal.set(nk,'day');
      }
    });
  }
  ingest(a);
  ingest(b);
  normVal.forEach((v,nk)=>{ out[nk]=v; });
  return out;
}
/** 設定ラベルの同値正規化（例: 尿量 1000 と 1,000 を同一とみなす） */
function canonicalSettingLabel(key, s){
  const v=String(s==null?'':s).trim();
  if(!v) return '';
  if(key==='exUrineMlOptions'){
    const n=Number(v.replace(/,/g,''));
    if(Number.isFinite(n)) return String(n);
  }
  return v;
}
/** 設定の文字列配列（選択肢）を和集合。先に local の順、続けて remote だけのもの。両方空なら defFallback */
function mergeSettingsStringArrayUnion(a, b, defFallback, key){
  const out=[];
  const seen=new Set();
  const push=(arr)=>{
    (Array.isArray(arr)?arr:[]).forEach(x=>{
      const s=String(x==null?'':x).trim();
      const c=canonicalSettingLabel(key, s);
      if(!s||!c||seen.has(c)) return;
      seen.add(c);
      out.push(s);
    });
  };
  push(a);
  push(b);
  if(!out.length) push(defFallback);
  return out;
}
/** 尿量（㎖）など数値だけのラベルなら昇順に整列 */
function sortNumericStringLabelsIfAllNumeric(arr){
  const list=Array.isArray(arr)?arr.map(x=>String(x).trim()).filter(Boolean):[];
  if(!list.length) return list;
  const nums=list.map(s=>Number(s.replace(/,/g,'')));
  if(!nums.every(n=>Number.isFinite(n))) return list;
  return [...list].sort((x,y)=>Number(x.replace(/,/g,''))-Number(y.replace(/,/g,'')));
}
/** バイタル等の行削除墓石キー（例 v:abc123） */
function recordItemDelKey(kind, id){

function recordItemDelMapActive(){

function shouldDropMergedRecordItem(delKind, item, delMap){
  if(!delKind||!item) return false;
  const id=String(item.id||'').trim();
  if(!id) return false;
  const delAt=_numU((delMap||{})[recordItemDelKey(delKind, id)]);
  if(!delAt) return false;

function medSlotDeletedAt(dk, name, timing, delMap){

function shouldDropMergedSupply(s, delMap){
