<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト2：JavaScript</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 40px; background: #fff; color: #000; font-size: 18px; }
.box { background: #efe; padding: 20px; border: 2px solid #060; border-radius: 8px; margin: 20px 0; }
#result { background: #ffe; padding: 20px; border: 2px solid #a60; border-radius: 8px; margin: 20px 0; font-weight: bold; }
button { font-size: 16px; padding: 12px 24px; margin: 8px 0; }
</style>
</head>
<body>
<h1>テスト2：JavaScriptが動くか</h1>
<div class="box">緑の枠：HTML読込OK</div>
<div id="result">ここに「JS動作OK」と出れば成功</div>
<button id="btn">ボタンを押してください</button>
<div id="btnResult"></div>

<script>
document.getElementById('result').textContent = 'JS動作OK ✓';
document.getElementById('result').style.background = '#cfc';
document.getElementById('btn').addEventListener('click', function() {
  document.getElementById('btnResult').textContent = 'ボタンも動きました！時刻: ' + new Date().toLocaleTimeString();
  document.getElementById('btnResult').style.cssText = 'background:#cfc; padding:14px; border-radius:6px; margin-top:10px;';
});
</script>
</body>
</html>
